# Canonical ban list for freshness rejection.
#
# Loaded at module init by `bot/utils/freshness.py` and consulted by both
# the runtime validator (every scheduled-message text passes through
# `freshness_rejection()`) and the guardian test
# `tests/test_no_hardcoded_content.py` so there's only one source of truth.
#
# When new generated content keeps slipping through with stale phrasing,
# add the offending fragment here — no code change required.

# Strings that betray a placeholder or stale draft. Reject outright.
stale_fragments:
  - "מתחממים לחידת אימוג'י"
  - "נפתח Emoji Night בנושא"
  - "נקודות למהירים"
  - "מתחילים סיבוב"
  - "בפינה של בוטסון"
  - "תיבחר מהמאגר בזמן השליחה"
  - "ייבחר מהמאגר בזמן השליחה"
  - "הבוט יבדוק וישלח אם נמצא משחק רלוונטי"
  - "יופק מנתוני הפעילות בזמן השליחה"
  - "תופק מנתוני הרמות בזמן השליחה"
  - "חידת אמוג'י של הערב"
  - "פוסט קהילתי — למה בוטסון קיים"
  - "סלוט 1/5"
  - "trivia-israel-announce"
  - "Emoji Night seed review"
  - "emoji-puzzle-seed"

# Strings that promise an RSVP-style behavior the runtime won't actually
# deliver. Reject so we don't tell users to "click the button" when there
# isn't one.
misleading_ready_fragments:
  - "מסמנים שהם בפנים"
  - "שמסמנים שהם בפנים"
  - "צריך לפחות"

# Generic filler phrases the LLM gravitates toward when it has nothing
# specific to say. Reject so prompts stay substantive.
generic_fragments:
  - "היום הזה עוד לא הוחלט"
  - "מה הדבר הכי שווה שאתם מכניסים אליו"
  - "יצור (ממשי או מהדמיון)"
  - "מה עשה לכם את היום"
  - "מה טוב היום"
  - "הגענו לאמצע השבוע"
  - "מה שיניתם בו ממה שתכננתם ביום ראשון"
  - "מבוגר האחראי בסיטואציה"
  - "כמעט סוף שבוע"
  - "מה דבר אחד שאתם רוצים לסגור לפני שישי"
  - "עוד שעה אחת לפני שנגמר השבוע"
  - "מה אתם עושים איתה"
  - "עוד קצת ואז כבר סוף שבוע"
  - "הריטואל שסוגר לכם את השבוע"
  - "האנרגיה הזו"
  - "ז'אנר מסוים"
  - "מגלים שזה משהו אחר לגמרי"
  - "מי חטף פנים"
  - "מי מוסיף פנים"
  - "בראש השולחן"
  - "רשות מלאה לעשות בדיוק מה שבא לכם"
  - "בלי תוכניות גדולות"
  - "ניצחון או ויתור"
  - "החלטתם שממנו זה הדבר"
  - "החיה הכי חמודה"
  - "מה עדיין זוהר אצלכם מהיום"
  - "מה יצאתם ליצור"
  - "קפה ראשון בשקט"
  - "רצים כבר שתתחיל הרעש"
  - "נסגרים מוקדם"
  - "מנצלים את הדממה"
  - "מה הדבר הכי חמוד שראיתם השבוע"
  - "לעצור הכל ולצחוק"
  - "חצי שבוע עבר"
  - "מה עדיין חם"
  - "משמירים"
  - "מגמרים"
  - "נוטלים לעצמכם"
  - "סדרה שטעיתם"
  - "תמדנו חברה"
  - "גונבים לעצמכם"
  - "עלה על הסדר"
  - "סוגרים את השבת"
  - "טבעוני הפך כל כך לנורמלי"
  - "מה הדבר הקטן שמחכה לכם הערב"
  - "הרגע שבין עוד לא נגמר"
  - "עוד לא נגמר לשוב"
  - "מה הוא נראה אצלכם"
  - "הכי שני במחלוקת"
  - "שדווקא גרם לכם ללכת לבדוק"
  - "מתי בדיוק החלטתם שהיום נגמר"
  - "קפה, מקלחת, סגירת המחשב"
  - "מה הכי הפתיע אתכם בעצמכם"
  - "שלב הסינגלות הנוכחי"
  - "בשעה שהמטבח כבר קר"
  - "אוכלים שהוא בקרוב צמחי"

# Regex templates for day-of-week claims. `{day_alt}` is replaced at runtime
# with the configured Hebrew day names from settings.yaml:copy.time_context.
day_anchor_patterns:
  - "\\bיום\\s+({day_alt})\\b"
  - "\\b(?:בוקר|ערב|צהריים|לילה)\\s+של\\s+({day_alt})\\b"
  - "\\b(?:בוקר|ערב|צהריים|לילה)\\s+({day_alt})\\b"
  - "\\b({day_alt})\\s+(?:בבוקר|בערב|בלילה|בצהריים)\\b"
  - "\\b({day_alt})\\s+(?:שמח|טוב|שלום)\\b"
