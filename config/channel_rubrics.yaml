# T-173: per-channel guidance injected into discussion-prompt generation.
# Each rubric is 2-3 short lines that sharpen the generic "be specific"
# rules in question_quality.md for the channel's audience and tone.
#
# Keys must match the discussion category keys in
# settings.yaml:topics.discussions.
#
# Editing rules:
# - Hebrew, second-person plural (אתם) — matches the community register.
# - 2-3 lines, each one a concrete steer or anti-pattern.
# - Operator-tunable; the runtime reloads on dashboard config reload.

rubrics:
  movies:
    - "התמקדו בחוויות צפייה ספציפיות, ז'אנרים, רגעים בלתי-נשכחים."
    - "הימנעו משאלות 'מה הסרט האהוב' בנוסח גנרי. בקשו פרט, השוואה, או דעה לא פופולרית."

  gaming:
    - "התמקדו במשחקים קונקרטיים, בחירות עיצוב, רגעי משחק. לא 'מה הז'אנר האהוב'."
    - "הימנעו מ-console war flamebait או השוואות פלטפורמה גנריות."

  music:
    - "התמקדו באלבומים/אמנים ספציפיים, רגעים, ז'אנרים. עדיפות לחוויית האזנה."
    - "הימנעו מ'איזו מוזיקה אתם אוהבים' — שאלו על תקופה, אווירה, או שינוי טעם."

  vegan:
    - "התמקדו בהמלצות קונקרטיות, טיפים, מתכונים, מסעדות. ערך מעשי."
    - "אל תהפכו את הקבוצה לזירת ויכוח טבעוני vs קרניבור. השאלות פנימה."

  politics:
    - "שאלות עם זווית אישית, לא הצהרות עמדה. דקויות מעניינות אזרחים חושבים."
    - "אסור: שאלות שמייצרות שיימינג. הזמינו ניואנס לא קרבות."

  art:
    - "התמקדו בתהליך, בכלים, ברגעי תקיעות, בהשראה. ערך פנימי או טכני."
    - "הימנעו מ'מה אתם יוצרים' פתוח — בקשו פרט מסוים, החלטה, או דעה על מדיום."

  funny:
    - "הומור עדין, יומיומי, מהחיים. לא ממים גנריים, לא דחיפת פאנצ'ליין."
    - "השאלה צריכה להזמין חשיפה של רגע מצחיק או תצפית קטנה — לא 'מה הכי מצחיק'."

  cute:
    - "ביטויי חמידות עם הקשר — חיה, רגע, פרט. לא 'מה הכי חמוד' פתוח."
    - "עדיפות לסיפור או תיעוד שהמשתמשים יכולים לשתף."

  singles:
    - "חוויות יומיום של חיים בגפם — בחירות קטנות, יתרונות, אתגרים, רגעי אושר."
    - "הימנעו מ'מתי תתחתנו' או ציפיות לזוגיות. הזמינו תכנים על להיות לבד טוב."
