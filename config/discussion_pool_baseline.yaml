# T-171 baseline: pool entries that currently fail the validator but are
# being kept in-tree intentionally. The guardian runs green against this
# allowlist; bring the list down to zero over time.
#
# Format:
#   allowlist:
#     <category>: ["<exact text>", ...]
#
# Each entry should have a one-line comment in the burn-down list below
# explaining why it's allowlisted and how to retire it.

allowlist:
  art:
    - "<category itself>"
  funny:
    - "<category itself>"
  general:
    - "<category itself>"
