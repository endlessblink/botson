enhance:
  prompt: |
    שפר את טיוטת עדכון הקהילה הבאה בעברית.

    כללים:
    - שמור על אותה משמעות, בלי להמציא פרטים חדשים.
    - כתוב טבעי, קצר וברור, כמו הודעה לקהילה ולא כמו קופי שיווקי.
    - אם יש כותרות קיימות, שמור על מבנה דומה.
    - אל תוסיף מרכאות, הסברים, הקדמות או חלופות.
    - החזר רק את הטקסט המשופר.

    הטיוטה:
    {text}
