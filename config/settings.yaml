trivia:
  # The 20-min group warm-up reminder is redundant now that signed-up users get
  # a personal DM reminder. Off by default to cut group spam; set true to restore
  # the in-group reminder (it's still auto-skipped when RSVP quorum is met).
  warmup_reminder_enabled: false
  # RSVP gate: when true, a trivia/emoji game is CANCELLED if fewer than
  # min_ready_players clicked the warm-up RSVP button. Disabled by default —
  # it was cancelling ~80% of scheduled games for too few RSVPs (2026-05-23),
  # suppressing the engagement it was meant to protect. With it off, games
  # always fire and the RSVP button still records interest. Set true to restore.
  rsvp_gate_enabled: false
  # Orphan-game guard: a trivia/emoji row that carries a warmup_marker but has
  # NO matching warm-up announcement row was scheduled without its warm-up pair
  # (2026-05-23: an emoji game solo-launched with no announcement). When true,
  # dispatch skips such a row instead of silently firing it. Games without a
  # marker (legacy / coerced launches) are unaffected. Set false to allow them.
  require_warmup_announcement: true
  # Delete public game sign-up announcements after this many minutes. DB history
  # and per-game RSVP rows stay intact. 0 disables cleanup.
  warmup_public_cleanup_minutes: 20
