holiday_blackouts:
- date: '2026-04-13'
  name: יום השואה
  note: לפרסם רק תוכן ידני ומאושר. מתאים להודעת זיכרון קצרה, מכבדת ולא שגרתית.
  block_auto: true
- date: '2026-04-20'
  name: יום הזיכרון
  note: לפרסם רק תוכן ידני ומאושר. מתאים להודעת זיכרון/התכנסות שקטה ולא לפעילות אוטומטית רגילה.
  block_auto: true
gamification:
