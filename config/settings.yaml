antispam:
  dry_run: false
  duplicate_threshold: 3
  duplicate_window_seconds: 60
  max_links_new_member: 3
  mute_duration_minutes: 10
  new_member_days: 7
  new_member_grace_seconds: 30
  # Members in the group longer than this are never auto-deleted/banned/muted.
  # Admins still get notified, but the message stays. Set to 0 to disable.
  trusted_member_days: 4
bot:
  name: Botson
  # Identity context injected into every LLM-generated message. Was a
  # hardcoded constant in dashboard/app.py — Phase A.2.1 reads from here.
  community_context: |
    קהילת "אלהוריים וזה" — קהילת צ'ילדפרי (ללא ילדים מבחירה) בטלגרם.
    הקבוצה הראשית פעילה ב-RTL, התרבות ביתית-חברית, התוכן הומור-ענייני, גמיש בנושאים אבל מכבד את הקו ה-childfree.
    כתבו בשפה טבעית, ישירה, ללא סלוגנים שיווקיים. אל תשתמשו ב"אנחנו, הקהילה" — דברו אל החברים.

# Centralized user-facing copy. Every Hebrew template the bot or
# dashboard surfaces should read from here via `bot/utils/copy.py:load_copy`.
# See CLAUDE.md → "No Hardcoded User-Facing Content" for the rule.
# This namespace is seeded by Phase F; Phase A.2 populates it as handlers
# migrate. Missing keys log a warning and render `[copy missing: ns.key]`.
copy:
  # Theme label used when poll_options doesn't carry an explicit
  # theme_label. Set to "" to disable the fallback (rows without a theme
  # will be skipped or rendered without a label).
  default_theme_label: "כללי"
  # Activity label used in the cancel notice when neither activity_label
  # nor theme_label is present. Set to "" to disable.
  default_activity_label: "המשחק"
  # Private DM menu (bot/handlers/dm_menu.py). Users open it via the
  # t.me/<bot>?start=menu deep link or /menu in a private chat with the bot.
  dm_menu:
    greeting: |-
      שלום! אני Botson, הבוט של אלהוריים וזה 🌟
      הוסיפו אותי לקבוצה כדי שאוכל לעזור.
      שלחו /help לרשימת פקודות, או /menu לתפריט אישי.
    menu_title: "מה תרצו לעשות? 👇"
    btn_upcoming: "📅 משחקים ואירועים קרובים"
    btn_prefs: "🔔 העדפות התראות"
    btn_back: "⬅️ חזרה לתפריט"
    # Persistent reply-keyboard buttons — pinned above the text box, always
    # visible, so users never need to remember /menu. Changing these labels
    # requires a bot restart (read at handler registration). Tapping a button
    # sends its exact text, matched by handle_menu_text in dm_menu.py.
    kb_upcoming: "📅 משחקים ואירועים"
    kb_prefs: "🔔 התראות"
    # Description shown next to /menu in Telegram's command (Menu) button.
    cmd_menu_desc: "התפריט האישי שלי"
    cmd_help_desc: "עזרה ורשימת פקודות"
    # Label of the URL button appended to group posts that link into the DM.
    open_in_dm: "⚙️ פתחו תפריט אישי"
    open_game_in_dm: "🔔 תזכורת בפרטי"
    dm_only_notice: "התפריט האישי זמין רק בצ'אט פרטי עם הבוט."
    # --- Upcoming items list (Phase 2) ---
    upcoming_title: "מה מתוכנן בקרוב 👇"
    upcoming_empty: "אין כרגע משחקים או אירועים מתוכננים. בקרוב יהיה! 🌟"
    # {icon} {label} — {when}
    item_line: "{icon} {label} — {when}"
    icon_game: "🎮"
    icon_event: "🎉"
    # Fallback label for a game warm-up with no theme/activity label.
    label_game_default: "משחק"
    btn_rsvp_yes: "✅ מגיע/ה!"
    btn_rsvp_maybe: "🤔 אולי"
    btn_signup_interest: "🙋 אני בפנים!"
    btn_signed_up: "✅ נרשמת — בטל הרשמה"
    signup_not_open_yet: "ההרשמה למשחק הזה תיפתח קרוב יותר למועד 🙂"
    signup_done: "רשמנו אותך! נתראה שם 🎉"
    signup_done_dm: "רשמנו אותך לתזכורת על {label}. אפשר לבטל מכאן בכל רגע."
    signoff_done: "ביטלת את ההרשמה."
    signoff_done_dm: "ביטלתי את התזכורת למשחק הזה."
    signup_unavailable: "ההרשמה כבר לא זמינה."
    signup_closed: "ההרשמה לפעילות הזו כבר נסגרה."
    # Activity-log line written when a user RSVPs via the DM menu.
    rsvp_log: "+{points} נקודות ל-{name} (אישור הגעה דרך תפריט אישי)"
    # --- Activity preferences (Phase 3) ---
    prefs_title: "בחרו אם לקבל התראות אישיות על אירועים 🔔"
    prefs_help: "התראות על משחקים נשלחות רק כתזכורת למי שנרשם למשחק ובחר זמן תזכורת."
    pref_on: "✅"
    pref_off: "☐"
    pref_saved: "נשמר!"
    pref_games: "משחקים (טריוויה / Emoji Night)"
    pref_events: "אירועים"
    # --- Opt-in DM notifications (Phase 4) ---
    notify_btn_signup: "🙋 אני בפנים!"
    notify_games: "🎮 משחק חדש נפתח להרשמה: {label}. רוצים להצטרף?"
    notify_events: "🎉 אירוע חדש פורסם: {label}. רוצים לאשר הגעה?"
    # --- Personal pre-game reminder (per-user lead time) ---
    reminder_section: "⏰ תזכורות אישיות למשחק שנרשמתם אליו"
    reminder_help: "בחרו כמה זמן לפני שהמשחק מתחיל לקבל תזכורת בפרטי. אפשר לבחור כמה זמנים."
    reminder_off_btn: "✖️ כבוי"
    reminder_lead_btn: "{minutes} דק'"
    reminder_lead_start_btn: "בהתחלה"
    reminder_saved: "התזכורת עודכנה ✅"
    reminder_dm: "🎮 {label} מתחילה בעוד ~{minutes} דקות! היכונו 🙌"
    reminder_dm_now: "🎮 {label} מתחילה עכשיו! 🙌"
    reminder_unsubscribe_btn: "🔕 בטלו תזכורת למשחק הזה"
    game_dm_prompt: "רוצים תזכורת אישית על {label}?"
  levels:
    fallback_tag: "רמה {level}"
  roundup: {}     # Phase A.2.4 populates from bot/handlers/roundup.py
  goals:
    prompt_reply_label: "תגובה להודעת בוט"
    goals_post_label: "הישגים"
    level_up: "🎉 מזל טוב {mention}! עלה/תה לרמה {level} — {emoji} {tag}!"
    milestone: "🔥 {name} הגיע/ה לרצף של {days} ימים! כל הכבוד! 🎉"
    streak_empty: "עדיין אין לך רצף! שתפ/י מטרה או הישג בערוץ יום יום כדי להתחיל 🌟"
    streak_status: |-
      🔥 הרצף שלך: {current} ימים
      🏆 הרצף הארוך ביותר: {longest} ימים
  digest: {}      # Phase A.2.4 populates from bot/handlers/daily_activity_digest.py
  antispam: {}    # Phase B.4 populates from bot/handlers/antispam.py
  facts:
    # Image-prompt templates sent to kie.ai. English by design (the model
    # is English-trained); operator-tunable so the visual style can shift
    # ("photorealistic", "watercolor", etc.) without a code change.
    image_prompt_mood_spooky: "cinematic mysterious editorial illustration"
    image_prompt_mood_tidbit: "curious science editorial illustration"
    image_prompt_suffix: "16:9, no text, no letters, no logos."
    image_prompt_hebrew_intro: "Illustrate this Hebrew Telegram post concept visually:"
    # Caption preface lines. Set the bot's voice once before the body of
    # each fact. Empty string disables. Trailing newline is added by the
    # caller — keep these single-line.
    preface_spooky: "🕯️ סיפור מסתורי מבוטסון"
    preface_tidbit: "🔎 ידעתם?"
  ai_populate:
    empty_title: "לא נמצאו הצעות שאפשר לאשר עכשיו."
    empty_subtitle: "הסיבות המרכזיות שזוהו:"
    empty_fallback: "אין הצעות לחלון הזה (כל הסלוטים תפוסים או שאין סוגי פעילות פנויים)"
    skip_past: "הזמן כבר עבר"
    skip_past_or_too_soon: "הזמן קרוב מדי או כבר עבר"
    skip_occupied: "כבר יש טיוטה/פרסום באותו סלוט"
    skip_time_occupied: "כבר יש משהו בשעה הזו"
    skip_default: "דולג"
  activity_copy:
    emoji_warmup: "🧩 Emoji Night על {theme_label} מתחיל ב-{game_time}. {puzzle_count} חידות; לחצו 🙋 כדי להיכנס."
    emoji_warmup_reminder: "תזכורת קצרה: Emoji Night על {theme_label} מתחיל ב-{game_time}. אם אתם בפנים, לחצו 🙋 בהודעה המקורית."
  # Per-puzzle text inside an Emoji Night round. Keyed by puzzle.media_type
  # so a music round asks about songs, a book round asks about books, etc.
  # Without these keys the per-puzzle prompt would default to movies/TV
  # regardless of the announced theme (BUG-1, 2026-05-17).
  emoji_puzzle:
    header: "חידת אימוג'י {index}/{total}"
    reply_hint: "השיבו ב-reply להודעה הזו. גם אם פספסתם חידה קודמת, היא עדיין פתוחה עד סוף המשחק."
    wrap_countdown: "⏳ המשחק נשאר פתוח עוד {minutes} דקות. אפשר עדיין לענות ב-reply לחידות לפני חשיפת התשובות."
    badge_general: "🧩"
    badge_movie: "🎬"
    badge_tv: "📺"
    badge_series: "📺"
    badge_book: "📚"
    badge_song: "🎵"
    question_general: "מה זה?"
    question_movie: "איזה סרט זה?"
    question_tv: "איזו סדרה זו?"
    question_series: "איזו סדרה זו?"
    question_book: "איזה ספר זה?"
    question_song: "איזה שיר או אמן זה?"
  time_context:
    day_names:
    - "ראשון"
    - "שני"
    - "שלישי"
    - "רביעי"
    - "חמישי"
    - "שישי"
    - "שבת"
    buckets:
      morning: "בוקר"
      noon: "צהריים"
      afternoon: "אחר הצהריים"
      evening: "ערב"
      night: "לילה"
    day_part: "יום {day} ({date})"
    time_part: "בשעה {time} ({bucket})"
    context_prefix: "\n\nהקשר זמן ההודעה: "
    context_suffix: ". התוכן צריך להרגיש מתאים ליום ולשעה האלה — לא טקסט גנרי שיכול להיות בכל זמן. אם הטקסט מציין יום בשבוע, חייב להיות בדיוק היום הזה ולא יום אחר."
    weekday_rubric_header: "\n\nניואנס היום (חובה לעגן בו):"
  materializer:
    kind_morning: "פתיחת יום"
    kind_evening: "סגירת יום"
    kind_discussion: "שאלה לערוץ {category}"
    discussion_default_category: "דיון"
    date_with_day: "תאריך: {date} (יום {day})"
    date_without_day: "תאריך: {date}"
    no_examples: "אין"
    prompt: |-
      כתוב טקסט חדש בעברית לטלגרם לקהילת מבוגרים ישראלית בלי ילדים.

      סוג: {kind}
      {date_line}
      שעה: {time}
      חובה: אם הטקסט מציין יום בשבוע, חייב להיות בדיוק "{day}" ולא יום אחר.

      דוגמאות השראה בלבד - אסור להעתיק או לפרפרז קרוב:
      {examples}

      כבר נשלח או תוזמן - אסור לחזור:
      {used_texts}

      חוקי פלט:
      - שורה אחת או שתיים.
      - לא להעתיק אף דוגמה.
      - בלי הבטחות לכפתורים או פעולות שאין בהודעה.
      - פלט JSON בלבד: {{"text":"..."}}{canonical_block}
  helpers:
    fallback_display_name: "חבר/ה"
  gamification: {}  # Phase A.2.3 populates level_up template

# LLM behavior. Phase B externalizes prompt rule numerics + model/endpoint.
llm:
  anthropic:
    api_url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514
  cli_model: haiku
  prompt_rules: {}  # Phase B.6 populates from dashboard/app.py:1080+, 3000+

# T-169: knobs for the daily auto-refill (bot/scheduler/materializer.py).
# The materializer is the bulk surface for community-facing text quality;
# these defaults exist to be tuned in production without code changes.
materializer:
  # Days of recent history to feed the LLM as a deterministic "do not
  # repeat" list. Previously the materializer truncated to the first 25
  # set entries (non-deterministic) and older repeats silently slipped
  # through, causing the 7-day cycling we saw in May 2026.
  used_texts_window_days: 45
  # Number of pool examples shown as style references in each generation
  # prompt. Fewer anchors = less verbatim echo. Default 2 (was 5).
  examples_per_prompt: 2
  # LLM candidates per slot before falling through to "skip". Each retry
  # adds the prior rejection reason so the model gets concrete guidance.
  retry_budget: 3

ai_populate:
  weekly_target: 10
  generation:
    retry_budget: 3
    dedup_window: 25
    opener_recent_window: 10
    temperature: 0.85
    pattern_rotation:
    - "תבנית חובה לניסיון הזה: שאלה בינארית / בחירה כפויה בין שתי אפשרויות יומיומיות."
    - "תבנית חובה לניסיון הזה: דירוג קצר או בחירת מקום ראשון מתוך זיכרון קונקרטי."
    - "תבנית חובה לניסיון הזה: המלצה ספציפית שאפשר לענות עליה בשם אחד או פרט אחד."
    - "תבנית חובה לניסיון הזה: דעה לא פופולרית או ויכוח קטן, בלי פרובוקציה."
    - "תבנית חובה לניסיון הזה: השלמת משפט קצרה עם עוגן מוחשי."
  flex:
    enabled: true
    day:
      enabled: true
      max_suggestions: 2
      min_lead_minutes: 10
      windows:
      - start: '20:00'
        end: '23:30'
        step_minutes: 30
      allowed_types:
      - discussion
      - custom
      topic_strategy: discussion_category
      rationale: חלון גמיש פנוי
    week:
      enabled: false
  caps:
    week:
      morning: 1
      evening: 1
      discussion: 2
      trivia_round: 1
      emoji_puzzle: 1
      facts_tidbit: 1
      facts_spooky: 1
      # Cron-owned types (free_games, weekly_roundup, weekly_leaderboard — see
      # bot/scheduler/dispatch_owner.py) are sent by their cron schedule, NOT
      # auto-populated as calendar rows. Caps kept at 0 so Populate never re-creates
      # them (doing both would duplicate the cron send — the 2026-05-23 bug).
      free_games: 0
      weekly_roundup: 0
      weekly_leaderboard: 0
    day:
      morning: 1
      evening: 1
      discussion: 1
      trivia_round: 1
      emoji_puzzle: 1
      facts_tidbit: 1
      facts_spooky: 1
      # See note above — cron-owned, kept at 0 to avoid duplicate sends.
      free_games: 0
      weekly_roundup: 0
      weekly_leaderboard: 0
# Lead time (minutes) for event reminders generated by the ✨ today-fill button.
# AI will schedule reminder = actual_event_time - this value, clamped to [now+5, event-5].
event_reminder_lead_minutes: 10
# Personal pre-game DM reminders: when a user signs up to a game (trivia/Emoji
# Night warm-up), the bot DMs them before kickoff. Multi-select — a user can pick
# any combination of lead times from the DM menu and gets one DM at each (0 = at
# kickoff). No selection = no reminders.
reminder:
  game_lead_options: [0, 5, 10, 30, 60]   # minute choices offered in the menu (0 = at start)
  default_game_lead_minutes: 30
# Defense-in-depth: if the bot's calendar_checker picks up a scheduled row more
# than this many minutes late (clock drift, bot was offline, SQL anomaly) it
# marks the row failed WITHOUT sending. Future-dated rows are unaffected. Set
# to 0 to disable the guard entirely.
stale_drop_minutes: 30
# Anti-clutter: minimum minutes between two posts to the SAME forum topic. A
# non-time-critical row (facts, discussion, morning/evening, custom) that would
# land on a topic which already got a send within this window is deferred to a
# later tick instead of stacking back-to-back. Live games / warm-ups / reminders
# / polls / events are never deferred — they claim the slot. 0 disables.
# (2026-05-23: an emoji game at 22:00 and a story at 22:01 piled into botson_corner.)
min_topic_spacing_minutes: 5
features:
  antispam:
    enabled: true
    groups:
    - main
    - test
  discussions: true
  emoji_puzzle:
    enabled: true
    groups:
    - main
  evening_prompt:
    enabled: true
    groups:
    - main
  events:
    enabled: false
    groups:
    - test
  free_games:
    enabled: false
    groups:
    - test
  goals:
    enabled: true
    groups:
    - main
  levels:
    enabled: true
    groups:
    - main
    - test
  morning_prompt:
    enabled: true
    groups:
    - main
  roundup:
    enabled: false
    groups:
    - test
  trivia:
    enabled: true
    groups:
    - main
    - test
  welcome:
    enabled: true
