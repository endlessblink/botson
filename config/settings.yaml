  helpers:
    fallback_display_name: "חבר/ה"
  gamification: {}  # Phase A.2.3 populates level_up template

# LLM behavior. Phase B externalizes prompt rule numerics + model/endpoint.
llm:
  anthropic:
    api_url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514
  cli_model: haiku
  # Per-call time budget for the generation CLIs. Raise these when
  # `vps-admin.sh llm-doctor` shows calls succeeding just under the
  # limit; lower them to fail over to the fallback faster when calls are
  # hanging rather than working slowly. A planner run makes many calls in
  # sequence, so each wasted budget is multiplied.
  cli_timeouts:
    claude_seconds: 90
    codex_seconds: 120
  prompt_rules: {}  # Phase B.6 populates from dashboard/app.py:1080+, 3000+

learning:
  # Ceiling on the auto-learned Hebrew rule list. Past a few dozen
  # directives the model averages over them instead of applying them,
  # and every line is prompt cost on every generation. When the list
  # crosses this, an LLM consolidation pass merges overlapping rules
  # back down to ~60% of the cap. Nothing is ever dropped mechanically:
  # if the consolidation call fails, the full list is kept as-is.
  max_hebrew_rules: 40

# T-169: knobs for the daily auto-refill (bot/scheduler/materializer.py).
# The materializer is the bulk surface for community-facing text quality;
# these defaults exist to be tuned in production without code changes.
materializer:
  # Days of recent history to feed the LLM as a deterministic "do not
  # repeat" list. Previously the materializer truncated to the first 25
  # set entries (non-deterministic) and older repeats silently slipped
  # through, causing the 7-day cycling we saw in May 2026.
  # Raised 45 → 180 on 2026-07-25: operator reported questions repeating.
  # A 45-day window let anything older than ~6 weeks come back verbatim.
  used_texts_window_days: 180
  # Number of pool examples shown as style references in each generation
  # prompt. Fewer anchors = less verbatim echo. Default 2 (was 5).
  examples_per_prompt: 2
  # LLM candidates per slot before falling through to "skip". Each retry
  # adds the prior rejection reason so the model gets concrete guidance.
  retry_budget: 3

ai_populate:
  weekly_target: 10
  # 0 = conversation starters (flex.week discussions) are NOT throttled on days
  # that already have other content. A truthy value here was being used as a
  # *ceiling* on flex discussions (min(per_day_max, floor - existing)), so busy
  # near-term days got zero conversation starters — the opposite of a "minimum".
  # Keep at 0 so flex is governed only by flex.week.per_day_max.
  weekly_min_per_day: 0
  # Length (in days) of the rolling "fill a week" Populate window. The week
  # button fills the next N days starting today, regardless of the Sun–Sat
  # calendar boundary, so it always yields a full upcoming week of free slots.
  rolling_window_days: 7
  generation:
    retry_budget: 5
    dedup_window: 25
    opener_recent_window: 10
    temperature: 0.85
    pattern_rotation:
    - "תבנית חובה לניסיון הזה: שאלה בינארית / בחירה כפויה בין שתי אפשרויות יומיומיות."
    - "תבנית חובה לניסיון הזה: דירוג קצר או בחירת מקום ראשון מתוך זיכרון קונקרטי."
    - "תבנית חובה לניסיון הזה: המלצה ספציפית שאפשר לענות עליה בשם אחד או פרט אחד."
    - "תבנית חובה לניסיון הזה: דעה לא פופולרית או ויכוח קטן, בלי פרובוקציה."
    - "תבנית חובה לניסיון הזה: שאלה על מקרה קונקרטי מהשבוע האחרון, עם פרט אחד שאפשר לענות עליו קצר."
  flex:
    enabled: true
    day:
      enabled: true
      max_suggestions: 2
      min_lead_minutes: 10
      windows:
      - start: '20:00'
        end: '23:30'
        step_minutes: 30
      allowed_types:
      - discussion
      - custom
      topic_strategy: discussion_category
      rationale: חלון גמיש פנוי
    week:
      # Subject discussions across a RANGE of hours (not one fixed slot),
      # spread over the rolling week to fill otherwise-empty days. Each lands
      # in its subject's channel (topic_strategy: discussion_category). Times
      # are picked from the window below; per_day_max keeps them spread.
      enabled: true
      # Whole-week flex budget. Covers 7 days × per_day_max with margin so later
      # days don't starve; today is processed first, so it is never
      # budget-starved. per_day_max still caps any single day.
      max_suggestions: 24
      # Conversation starters are the main content, so allow up to 3/day.
      per_day_max: 3
      min_lead_minutes: 30
      windows:
      - start: '12:00'
        end: '22:00'
        step_minutes: 60
      allowed_types:
      - discussion
      topic_strategy: discussion_category
      rationale: דיון נושאי בשעה גמישה
  caps:
    # Combined ceiling on executable games (trivia_round + emoji_puzzle) per day,
    # across types. The per-type week/day caps below still decide which game type
    # is eligible and how many per week; this only prevents two different games
    # landing on the same day. Which type wins a contested day follows the per-type
    # caps + the day's attempt order. Set to 0 to suppress game suggestions.
    games_per_day: 1
    week:
      morning: 1
      evening: 1
      # Fixed-time (18:00) anchored discussions are now the minority — empty
      # days are filled by flex.week subject discussions across a range of
      # hours (see flex.week above), so this stays low to avoid a definitive
      # 18:00 slot every day. 2/week of the anchored kind is plenty.
      discussion: 2
      trivia_round: 1
      emoji_puzzle: 1
      facts_tidbit: 1
      facts_spooky: 1
      # Cron-owned types (free_games, weekly_roundup, weekly_leaderboard — see
      # bot/scheduler/dispatch_owner.py) are sent by their cron schedule, NOT
      # auto-populated as calendar rows. Caps kept at 0 so Populate never re-creates
      # them (doing both would duplicate the cron send — the 2026-05-23 bug).
      free_games: 0
      weekly_roundup: 0
      weekly_leaderboard: 0
    day:
      morning: 1
      evening: 1
      discussion: 1
      trivia_round: 1
      emoji_puzzle: 1
      facts_tidbit: 1
      facts_spooky: 1
      # See note above — cron-owned, kept at 0 to avoid duplicate sends.
      free_games: 0
      weekly_roundup: 0
      weekly_leaderboard: 0
# Lead time (minutes) for event reminders generated by the ✨ today-fill button.
# AI will schedule reminder = actual_event_time - this value, clamped to [now+5, event-5].
event_reminder_lead_minutes: 10
# Personal pre-game DM reminders: when a user signs up to a game (trivia/Emoji
# Night warm-up), the bot DMs them before kickoff. Multi-select — a user can pick
# any combination of lead times from the DM menu and gets one DM at each (0 = at
# kickoff). No selection = no reminders.
reminder:
  game_lead_options: [0, 5, 10, 30, 60]   # minute choices offered in the menu (0 = at start)
  default_game_lead_minutes: 30
# Defense-in-depth: if the bot's calendar_checker picks up a scheduled row more
# than this many minutes late (clock drift, bot was offline, SQL anomaly) it
# marks the row failed WITHOUT sending. Future-dated rows are unaffected. Set
# to 0 to disable the guard entirely.
stale_drop_minutes: 30
# Anti-clutter: minimum minutes between two posts to the SAME forum topic. A
# non-time-critical row (facts, discussion, morning/evening, custom) that would
# land on a topic which already got a send within this window is deferred to a
# later tick instead of stacking back-to-back. Live games / warm-ups / reminders
# / polls / events are never deferred — they claim the slot. 0 disables.
# (2026-05-23: an emoji game at 22:00 and a story at 22:01 piled into botson_corner.)
min_topic_spacing_minutes: 5
