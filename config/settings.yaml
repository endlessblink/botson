antispam:
  dry_run: false
  duplicate_threshold: 3
  duplicate_window_seconds: 60
  max_links_new_member: 3
  mute_duration_minutes: 10
  new_member_days: 7
  new_member_grace_seconds: 30
  # Members in the group longer than this are never auto-deleted/banned/muted.
  # Admins still get notified, but the message stays. Set to 0 to disable.
  trusted_member_days: 4
tagall:
  message_chars: 2000
  output_chars: 3800
  cooldown_seconds: 300
  preview_ttl_seconds: 600
  roster_sync_enabled: true
  roster_sync_timeout_seconds: 60
  membership_check_concurrency: 10
bot:
  name: Botson
  # Identity context injected into every LLM-generated message. Was a
  # hardcoded constant in dashboard/app.py — Phase A.2.1 reads from here.
  community_context: |
    קהילת "אלהוריים וזה" — קהילת צ'ילדפרי (ללא ילדים מבחירה) בטלגרם.
    הקבוצה הראשית פעילה ב-RTL, התרבות ביתית-חברית, התוכן הומור-ענייני, גמיש בנושאים אבל מכבד את הקו ה-childfree.
    כתבו בשפה טבעית, ישירה, ללא סלוגנים שיווקיים. אל תשתמשו ב"אנחנו, הקהילה" — דברו אל החברים.

# Centralized user-facing copy. Every Hebrew template the bot or
# dashboard surfaces should read from here via `bot/utils/copy.py:load_copy`.
# See CLAUDE.md → "No Hardcoded User-Facing Content" for the rule.
# This namespace is seeded by Phase F; Phase A.2 populates it as handlers
# migrate. Missing keys log a warning and render `[copy missing: ns.key]`.
copy:
  tagall:
    all_label: "@all"
    syncing: "בודק את חברי הקבוצה…"
    group_only: "הפקודה זמינה רק בתוך קבוצה."
    not_authorized: "רק מנהלים יכולים לתייג את הקבוצה."
    missing_message: "צריך להוסיף הודעה אחרי /tagall."
    message_too_long: "ההודעה ארוכה מדי לתג הקבוצתי."
    preview: "אפשר לתייג {eligible} חברים. {skipped} לא נכללו אחרי בדיקת חברות. לפרסם?"
    confirm_button: "✅ פרסום ותיוג"
    cancel_button: "ביטול"
    expired: "התצוגה המקדימה פגה או שאינה שייכת לך."
    cancelled: "התיוג בוטל."
    cooldown: "תיוג קבוצתי נוסף עדיין חסום לזמן קצר."
    no_members: "לא נמצאו חברים זמינים לתג. {skipped} חברים לא נכללו."
    sent: "פורסם: {tagged} חברים תויגו ב־{messages} הודעות; {skipped} לא נכללו."
    send_failed: "השליחה נעצרה אחרי {sent} הודעות. בדקו את הקבוצה לפני ניסיון נוסף."
  # Theme label used when poll_options doesn't carry an explicit
  # theme_label. Set to "" to disable the fallback (rows without a theme
  # will be skipped or rendered without a label).
  default_theme_label: "כללי"
  # Activity label used in the cancel notice when neither activity_label
  # nor theme_label is present. Set to "" to disable.
  default_activity_label: "המשחק"
  # "נסח מחדש" — one-off wording rewrite of a draft the operator likes.
  # Each anchor is a chip in the dashboard; `directive` is appended to the
  # rewrite prompt as extra instructions. Editing this list changes the
  # chips everywhere (planner cards, prompt drawer, review page) — the
  # front-ends read them from GET /api/rephrase-anchors, never inline.
  # This is a one-off edit only: picking an anchor never writes a learned
  # rule. Durable rules still come exclusively from reject + reason.
  rephrase_anchors:
    - key: less_translated
      label: "פחות תרגומית"
      directive: "כתוב עברית טבעית ומדוברת. אל תשמור על מבנה משפט אנגלי, אל תשתמש בתרגום מילולי של ביטויים לועזיים, ואל תכתוב משפט שנשמע כאילו תורגם מאנגלית."
    - key: shorter
      label: "קצר יותר"
      directive: "קצר משמעותית את הניסוח בלי לאבד את הרעיון המרכזי. הורד תיאורים, תנאים והקדמות."
    - key: more_spoken
      label: "יותר מדוברת"
      directive: "השתמש בשפה יומיומית שאנשים באמת מדברים בה בקבוצה, בלי מליצות ובלי עברית ספרותית."
    - key: less_generic
      label: "פחות גנרית"
      directive: "הפוך את השאלה לספציפית יותר — עוגן קונקרטי אחד שאי אפשר להעביר לקטגוריה אחרת."
    - key: more_concrete
      label: "דוגמה קונקרטית"
      directive: "בקש פרט אחד ממשי — שם, רגע, החלטה — ולא תחושה כללית או פסקת תיאור."
    - key: warmer
      label: "יותר חמה"
      directive: "שמור על טון מזמין וחברי, בלי להישמע כמו שאלון או משימה."
  # UI strings for the rephrase modal. Shared by all three surfaces.
  rephrase_ui:
    button_label: "✍️ נסח מחדש"
    modal_title: "ניסוח מחדש"
    modal_subtitle: "הרעיון נשאר — רק הניסוח משתנה. לא נשמר ככלל."
    anchors_label: "עוגני ניסוח"
    free_text_label: "הערה חופשית (רשות)"
    free_text_placeholder: "לדוגמה: בלי אמוג'י בהתחלה"
    apply_label: "נסח מחדש"
    cancel_label: "ביטול"
    working_label: "מנסח…"
    undo_label: "↩ החזר ניסוח קודם"
    replaced_badge: "נוסח מחדש"
    error_label: "הניסוח מחדש נכשל — הטקסט המקורי נשמר"
  # Private DM menu (bot/handlers/dm_menu.py). Users open it via the
  # t.me/<bot>?start=menu deep link or /menu in a private chat with the bot.
  dm_menu:
    greeting: |-
      שלום! אני Botson, הבוט של אלהוריים וזה 🌟
