  daily_activity_digest:
    enabled: true
    days:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    time: 09:30
  emoji_puzzle:
    days: []
    time: '22:00'
    announcement_lead_minutes: 90
    theme_label: ''
    media_types: []
    puzzle_count: 5
    interval_seconds: 60
    interval_minutes: 1
    intro_offset_seconds: 10
    wrap_offset_seconds: 900
    wrap_countdown_minutes:
    - 15
    - 10
    - 5
    - 1
