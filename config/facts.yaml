# Pool of "did you know" tidbits and spooky/folklore items, hand-curated
# from primary or near-primary sources. Bar: would a curious adult want to
# forward this? If it reads like a viral listicle, replace it.
#
# Spooky items especially need context before atmosphere: where are we,
# why should the reader care, what is documented vs. only folklore, and
# what specific detail makes the story worth opening in Telegram.
#
# Each item ships with a `source` line so future-Claude (or anyone) can
# verify before re-writing. Hebrew is the audience language; English is
# kept here for translator/editor reference only — the bot posts the
# `text_he` field.
#
# Categories drive the daily theme picker:
#   tidbit  → weekday "did you know" slot
#   spooky  → Saturday-night / Friday-night atmospheric slot
#
# Add new items at the bottom of each category. Don't auto-generate facts
# from an LLM — every entry must have a visible citation (`source`), an
# actual source URL (`source_url`), and a relevant image association
# (`image_url` or `image_prompt`). Items missing any of these are skipped by
# the runtime and rejected by tests/test_facts_pool.py.

tidbit:
  - id: marmoset_names
    text_he: |
      מחקר מהאוניברסיטה העברית (2024, פורסם ב-Science) מצא שקופי מרמוסט קוראים אחד לשני בשם.
      הם משתמשים בקריאות "פי" ספציפיות כדי לפנות לפרט מסוים — וענו אחרת כשהקריאה הייתה מופנית אליהם.
      עד אז ידעו רק על בני אדם, דולפינים ופילים שעושים את זה.
    source: "Oren et al., Science (2024). David Omer lab, Safra Center for Brain Sciences, Hebrew University."
    source_url: "https://www.science.org/doi/10.1126/science.adp3757"
    image_prompt: "Relevant editorial image of two common marmosets vocalizing to each other in a research setting, warm natural colors, documentary science style, no text, no logos."

  - id: roman_concrete_self_healing
    text_he: |
      בטון רומי שורד 2,000 שנה לא בזכות סוד אבוד — אלא בזכות גושי סיד קטנים שנחשבו במשך מאות שנים לסימן של עבודה לא מקצועית.
      מחקר של MIT והרווארד (2023) הראה שכשמופיע סדק זעיר, הסיד מגיב למים שחודרים פנימה ויוצר גביש סידן שסותם אותו תוך ימים.
      הבטון מתקן את עצמו.
    source: "Seymour et al., 'Hot Mixing: Mechanistic Insights into the Durability of Ancient Roman Concrete', Science Advances (2023)."
    source_url: "https://www.science.org/doi/10.1126/sciadv.add1602"
    image_prompt: "Relevant editorial image of ancient Roman concrete with lime clasts sealing a hairline crack as water enters, archaeological macro detail, no text, no logos."

  - id: octopus_active_sleep
    text_he: |
      תמנונים ישנים בשני מצבים — שינה שקטה, ופעם בכ-60 שניות הם נכנסים ל"שינה פעילה" שבה הם משנים צבע ותבנית עור בקצב מהיר, בדיוק כמו ערים.
      החוקרים זיהו שהתבניות הללו כמעט זהות לתבניות שהתמנונים מציגים בערות.
      ייתכן — והדגש על ייתכן — שאנחנו רואים תמנון חולם.
    source: "Pophale et al., 'Wake-like skin patterning and neural activity during octopus sleep', Nature (2023)."
    source_url: "https://www.nature.com/articles/s41586-023-05891-6"
    image_prompt: "Relevant editorial image of an octopus sleeping while its skin patterns and colors change, underwater documentary style, no text, no logos."

  - id: heart_cockle_fiber_optics
    text_he: |
      צדפת ה-heart cockle פיתחה אופטיקה סיבית — שימוש ראשון מתועד בטבע.
      בקליפה שלה יש "חלונות" זעירים ממינרל קלציט שמעבירים אור שמש פנימה לאצות פוטוסינתטיות שחיות בה.
      הצדפה עצמה נשארת מוגנת מתחת — זה אקווריום סולארי טבעי בן עשרות מיליוני שנים.
    source: "Li et al., 'Photonic structures in cardiid bivalves', Nature Communications (2024)."
    source_url: "https://www.nature.com/articles/s41467-024-48819-6"
    image_prompt: "Relevant editorial image of a heart cockle shell with translucent calcite windows channeling sunlight to algae, marine science macro, no text, no logos."

  - id: voynich_hidden_columns
    text_he: |
      כתב היד של וויניץ' (Voynich Manuscript) — ספר מהמאה ה-15 שאיש לא הצליח לקרוא במשך 600 שנה — נסרק בצילום רב-ספקטרלי ב-2024.
      התגלו שני טורי אותיות סמויים בעמוד הראשון, שנכתבו ככל הנראה ע"י בעליו במאה ה-17, יוהאנס מרקוס מרצי, רופא בפראג.
      ניסיון פענוח שכשל — כפי הנראה הראשון בכתב.
    source: "Lisa Fagin Davis (Manuscript Road Trip blog), multispectral imaging analysis (Sept 2024). Yale Beinecke Library MS 408."
    source_url: "https://beinecke.library.yale.edu/article/voynich-manuscript"
    image_prompt: "Relevant editorial image of a multispectral imaging setup examining the Voynich manuscript first page, medieval manuscript texture, no readable text, no logos."

  - id: dead_sea_scrolls_discovery
    text_he: |
      בתחילת 1947 רועה צאן בדואי בן 15 בשם מוחמד א-דיב חיפש עז שנעלמה בין הסלעים מצפון לים המלח.
      הוא זרק אבן לתוך מערה — ושמע שבירת חרס.
      בפנים נמצאו שבע מגילות עוטפות בפשתן בתוך כדים אטומים. אלה היו מגילות ים המלח, מהטקסטים העתיקים ביותר ששרדו מהמקרא, חבויים שם 2,000 שנה.
    source: "Library of Congress 'Scrolls from the Dead Sea' exhibition; deadseascrolls.org.il discovery archive."
    source_url: "https://www.loc.gov/exhibits/scrolls/"
    image_prompt: "Relevant editorial image of clay jars in a desert cave near the Dead Sea with linen-wrapped scrolls, archaeological documentary style, no text, no logos."

  - id: lascaux_seasonal_order
    text_he: |
      ציורי המערה בלאסקו (צרפת, לפני כ-21,000 שנה) צוירו לפי סדר עונתי קבוע — סוסים תחילה (אביב), ראם (קיץ), אילים (סתיו).
      זה לא היה אוסף אקראי, זו הייתה מערכת.
      תיאוריה אחת קושרת חלק מהציורים לקבוצת כוכבים שנראתה אז בשמיים — כולל הפליאדות.
    source: "Lascaux interpretation guides, Ministry of Culture France (archeologie.culture.gouv.fr/lascaux). Multiple seasonal-order analyses."
    source_url: "https://archeologie.culture.gouv.fr/lascaux/en"
    image_prompt: "Relevant editorial image inspired by Lascaux cave paintings arranged as seasonal animals under a prehistoric night sky, no modern text, no logos."

  - id: pakal_sarcophagus_real_meaning
    text_he: |
      את "האסטרונאוט המאיה" — מכסה הסרקופג של המלך פאקאל — אריך פון דניקן הציג ב-1968 כראיה לתיאוריית חייזרים.
      פיענוח אקדמי של האייקונוגרפיה מראה משהו אחר לגמרי: רגע מותו של פאקאל, ונפילתו אל העולם התחתון, מוקף בעץ-עולם וסימני שמש, ירח וכוכבים.
      קוסמולוגיה מאיה קלאסית, לא חליפת חלל.
    source: "Wikipedia 'Kʼinich Janaabʼ Pakal' summary of consensus epigraphy; National Geographic Palenque coverage."
    source_url: "https://en.wikipedia.org/wiki/K%CA%BCinich_Janaab%CA%BC_Pakal"
    image_prompt: "Relevant editorial image of the Palenque sarcophagus lid iconography with the Maya world tree and underworld symbolism, museum documentation style, no text, no logos."

  - id: pormpuraaw_cardinal
    text_he: |
      בשפת קוּק טאיוֹרֶה של אבוריג'ינים בפורמפוראאו (אוסטרליה) אין מילים ל"ימין" ו"שמאל".
      במקום זה משתמשים תמיד בכיווני שמיים: צפון, דרום, מזרח, מערב.
      התוצאה — דוברי השפה תמיד יודעים, באופן מיידי, איפה הצפון. גם בחדר חשוך, גם אחרי טיסה.
    source: "Lera Boroditsky, 'How Language Shapes Thought', Scientific American (2011). Original fieldwork: Levinson, Cognition (1997)."
    source_url: "https://www.scientificamerican.com/article/how-language-shapes-thought/"
    image_prompt: "Relevant editorial image of an Aboriginal Australian speaker navigating by cardinal directions in an open landscape, compass-like light cues, no text, no logos."

  - id: ashurbanipal_library
    text_he: |
      ספריית אשורבניפל בנינוה (המאה השביעית לפנה"ס) הייתה הספרייה הראשונה בהיסטוריה שאורגנה באופן שיטתי — לפי נושאים, עם קטלוג.
      30,000 לוחות חרס שורדים, וביניהם הגרסה השלמה ביותר של עלילות גילגמש.
      היא נשרפה כשנינוה נפלה ב-612 לפנה"ס — והאש אפתה את הלוחות לתוך נצח, וכך שרדו.
    source: "British Museum Ashurbanipal collection; Frame & George, 'The Royal Libraries of Nineveh' (Iraq, 2005)."
    source_url: "https://www.britishmuseum.org/collection/term/BIOG58120"
    image_prompt: "Relevant editorial image of Assyrian clay tablets from Ashurbanipal library in Nineveh, warm museum lighting, no text, no logos."

  - id: pompeii_fast_food_counter
    text_he: |
      בפומפיי נחפר תרמופוליום — דוכן אוכל חם — עם ציורי קיר של ברווז, תרנגול וכלב קשור ברצועה.
      בתוך כדי החרס נמצאו שרידי מזון, כולל עצמות ברווז, חזיר, עז ודגים.
      כלומר, לפני כמעט 2,000 שנה אנשים עצרו בדרך וקנו אוכל מוכן בדוכן רחוב מעוצב.
    source: "Pompeii Archaeological Park press release (2020); BBC News, Pompeii thermopolium coverage (2020)."
    source_url: "https://pompeiisites.org/en/press-kit-en/the-thermopolium-of-regio-v/"
    image_prompt: "Relevant editorial image of a Roman thermopolium counter in Pompeii with painted food signs and clay jars, archaeological documentary style, no text, no logos."

  - id: antikythera_eclipse_dials
    text_he: |
      מנגנון אנטיקיתרה, שנמשה מספינה טרופה יוונית, לא היה רק גלגלי שיניים יפים.
      מחקרים מודרניים הראו שהוא חישב ליקויי שמש וירח, מחזורי ירח ואירועי משחקים פאן-הלניים.
      מחשב אנלוגי בן יותר מ-2,000 שנה, בגודל קופסת נעליים.
    source: "Freeth et al., Nature (2006, 2008); Antikythera Mechanism Research Project."
    source_url: "https://www.nature.com/articles/nature05357"
    image_prompt: "Relevant editorial image of the Antikythera mechanism bronze gears beside lunar eclipse diagrams, museum macro, no text, no logos."

  - id: oldest_known_recipe_tablets
    text_he: |
      באוסף הבבלי של ייל יש לוחות חרס בני כ-3,700 שנה עם מתכונים.
      הם כוללים תבשילי בשר, מרקים ותיבול בבצל, שום, כוסברה וכמון.
      ספר הבישול הקדום בעולם נראה פחות כמו טקס מסתורי ויותר כמו מטבח ביתי עשיר מאוד.
    source: "Yale Babylonian Collection; Bottéro, 'The Oldest Cuisine in the World' (University of Chicago Press, 2004)."
    source_url: "https://babylonian-collection.yale.edu/collections/highlights/cuisine"
    image_prompt: "Relevant editorial image of ancient Babylonian recipe tablets beside bowls of herbs and stew ingredients, museum food history style, no text, no logos."

  - id: neanderthal_tar_glue
    text_he: |
      ניאנדרטלים ייצרו דבק מזפת קליפת ליבנה הרבה לפני מעבדות מודרניות.
      כדי לקבל את הזפת צריך לחמם קליפה בלי חמצן, תהליך שמצריך שליטה באש ותכנון.
      הכלי הקטן עם הדבק אומר משהו גדול: טכנולוגיה מורכבת לא הייתה המצאה בלעדית של הומו ספיינס.
    source: "Kozowyk et al., Scientific Reports (2017); Schmidt et al., PNAS (2023)."
    source_url: "https://www.nature.com/articles/s41598-017-08106-7"
    image_prompt: "Relevant editorial image of Neanderthal stone tools hafted with birch tar glue near a controlled fire, prehistoric documentary style, no text, no logos."

  - id: vikings_crystal_sunstones
    text_he: |
      אבן קלציט איסלנדית יכולה לפצל אור ולהראות את כיוון השמש גם כשהשמיים מעוננים.
      ניסויים הראו שאפשר לנווט כך בדיוק מפתיע, והרעיון מתאים לתיאורי "אבני שמש" בסאגות נורדיות.
      אין הוכחה שכל ויקינג השתמש בזה, אבל הפיזיקה עובדת.
    source: "Ropars et al., Proceedings of the Royal Society A (2011); Nature News coverage."
    source_url: "https://royalsocietypublishing.org/doi/10.1098/rspa.2011.0369"
    image_prompt: "Relevant editorial image of an Iceland spar crystal splitting cloudy sunlight over a Viking navigation map, no text, no logos."

  - id: herculaneum_scrolls_ai
    text_he: |
      מגילות הרקולנאום נשרפו ונמחצו בהתפרצות וזוב בשנת 79 לספירה, ואי אפשר לפתוח אותן בלי להרוס אותן.
      ב-2023–2024 צוותי מחקר השתמשו בסריקות CT ולמידת מכונה כדי לקרוא אותיות מתוך פחם מגולגל.
      מילים יווניות חזרו להופיע אחרי כמעט 2,000 שנה בלי לגעת במגילה.
    source: "Vesuvius Challenge publications (2023-2024); University of Kentucky EduceLab."
    source_url: "https://scrollprize.org/"
    image_prompt: "Relevant editorial image of a carbonized Herculaneum scroll scanned by CT with faint Greek letters revealed digitally, no text, no logos."

  - id: whales_culture_songs
    text_he: |
      לווייתני גיבנת מפיצים שירים כמו אופנות תרבותיות.
      מחקר באוקיינוס השקט הראה ששיר חדש יכול לעבור מאוכלוסייה אחת לשנייה לאורך אלפי קילומטרים, כמעט תמיד ממערב למזרח.
      זו לא רק תקשורת; זו תרבות שנודדת במים.
    source: "Garland et al., Current Biology (2011); University of Queensland whale song research."
    source_url: "https://www.cell.com/current-biology/fulltext/S0960-9822(11)00302-2"
    image_prompt: "Relevant editorial image of humpback whales singing across ocean migration routes visualized as sound waves, no text, no logos."

  - id: tardigrade_glass_state
    text_he: |
      דובוני מים יכולים להתייבש כמעט לגמרי ולהיכנס למצב "טון" שבו חילוף החומרים כמעט נעצר.
      חלבונים מיוחדים בגוף שלהם הופכים את פנים התא למעין זכוכית, שמייצבת מולקולות עד שהמים חוזרים.
      כשמרטיבים אותם שוב — הם מתעוררים.
    source: "Boothby et al., Molecular Cell (2017); PLoS Biology tardigrade desiccation studies."
    source_url: "https://www.cell.com/molecular-cell/fulltext/S1097-2765(17)30033-2"
    image_prompt: "Relevant editorial macro image of a tardigrade in suspended animation with glass-like cellular preservation, science illustration style, no text, no logos."

  - id: bees_zero_concept
    text_he: |
      דבורים יכולות להבין את המושג אפס ברמה בסיסית.
      בניסוי הן למדו לבחור את הקבוצה עם פחות פריטים, ואז העדיפו משטח ריק על פני משטח עם סימן אחד.
      מוח קטן ממילימטרים עשה פעולה שנחשבה פעם ליכולת מתמטית מתקדמת.
    source: "Howard et al., Science (2018), 'Numerical ordering of zero in honey bees'."
    source_url: "https://www.science.org/doi/10.1126/science.aar4975"
    image_prompt: "Relevant editorial image of a honeybee choosing between visual number cards including an empty card, behavioral experiment style, no text, no logos."

  - id: raven_future_planning
    text_he: |
      עורבים יכולים לתכנן לעתיד גם כשזה לא קשור להחבאת מזון.
      במחקר הם בחרו כלי שיעזור להם לפתוח קופסה רק אחרי זמן המתנה, ודחו פרס מיידי לטובת פרס גדול יותר אחר כך.
      זו יכולת שנראית דומה להפליא לתכנון אצל קופי אדם.
    source: "Kabadayi & Osvath, Science (2017), 'Ravens parallel great apes in flexible planning for tool-use and bartering'."
    source_url: "https://www.science.org/doi/10.1126/science.aam8138"
    image_prompt: "Relevant editorial image of a raven selecting a tool for a delayed puzzle box reward, animal cognition lab style, no text, no logos."

  - id: plants_click_when_stressed
    text_he: |
      צמחים בלחץ משמיעים קליקים על-קוליים.
      מחקר מאוניברסיטת תל אביב הקליט עגבניות וטבק שהתייבשו או נחתכו, והראה שהצלילים ניתנים לזיהוי לפי סוג הלחץ.
      אנחנו לא שומעים את זה, אבל חרקים ויונקים מסוימים אולי כן.
    source: "Khait et al., Cell (2023), Tel Aviv University plant acoustics study."
    source_url: "https://www.cell.com/cell/fulltext/S0092-8674(23)00262-3"
    image_prompt: "Relevant editorial image of tomato plants in a soundproof chamber with ultrasonic microphones, plant science style, no text, no logos."

  - id: glass_frogs_hide_blood
    text_he: |
      צפרדעי זכוכית נהיות שקופות יותר כשהן ישנות.
      חוקרים גילו שהן מרכזות עד 89% מתאי הדם האדומים בכבד, שמכוסה במראה מחזיר אור.
      הן כמעט מעלימות את הדם שלהן כדי לא להטיל צל אדום מתחת לעלה.
    source: "Taboada et al., Science (2022), glass frog transparency research."
    source_url: "https://www.science.org/doi/10.1126/science.abl6620"
    image_prompt: "Relevant editorial image of a sleeping glass frog on a leaf with translucent body and hidden red blood cells, macro science style, no text, no logos."

  - id: elephant_names_calls
    text_he: |
      פילים אפריקאים משתמשים בקריאות שנראות כמו שמות אישיים.
      במחקר מ-2024, מודל זיהה קריאות שמיועדות לפרט מסוים, ופילים הגיבו חזק יותר כששמעו קריאה שהופנתה אליהם.
      זו תקשורת חברתית עדינה בהרבה מ"קול עדר" כללי.
    source: "Pardo et al., Nature Ecology & Evolution (2024), African elephant vocal labels."
    source_url: "https://www.nature.com/articles/s41559-024-02420-w"
    image_prompt: "Relevant editorial image of African elephants calling to one another across savanna with subtle sound labels visualized, no text, no logos."

  - id: dog_nose_heat_sensor
    text_he: |
      האף הקר של כלבים אינו רק חמוד — הוא יכול לזהות קרינת חום חלשה.
      במחקר התנהגותי והדמיית מוח, כלבים הבחינו בין חפצים חמים וקרים גם בלי ריח או מגע.
      האף שלהם עובד קצת כמו חיישן אינפרה-אדום קטן.
    source: "Bálint et al., Scientific Reports (2020), canine rhinarium weak thermal radiation sensing."
    source_url: "https://www.nature.com/articles/s41598-020-60439-y"
    image_prompt: "Relevant editorial close-up of a dog's cold nose sensing faint heat from an object, scientific thermal visualization, no text, no logos."

  - id: magnetic_bacteria_compass
    text_he: |
      יש חיידקים שמגדלים בתוך עצמם שרשרת גבישי מגנטיט זעירים.
      השרשרת מתפקדת כמו מחט מצפן ומסדרת את החיידק לפי השדה המגנטי של כדור הארץ.
      כך הוא מוצא מהר יותר את שכבת המים עם כמות החמצן שמתאימה לו.
    source: "Bazylinski & Frankel, Nature Reviews Microbiology (2004), magnetotactic bacteria review."
    source_url: "https://www.nature.com/articles/nrmicro842"
    image_prompt: "Relevant editorial microscopy image of magnetotactic bacteria with internal magnetite crystal chains aligned to Earth's field, no text, no logos."

  - id: purple_earth_hypothesis
    text_he: |
      יש השערה שכדור הארץ הקדום נראה סגלגל יותר מירוק.
      לפני שהכלורופיל השתלט, מיקרובים מסוימים אולי השתמשו ברטינל — פיגמנט סגול — כדי לקלוט אור.
      זו לא עובדה מוכחת, אלא רעיון אסטרוביולוגי שמציע לחפש גם "קצה סגול" בכוכבי לכת אחרים.
    source: "DasSarma & Schwieterman, International Journal of Astrobiology (2021); Scientific American coverage."
    source_url: "https://www.cambridge.org/core/journals/international-journal-of-astrobiology/article/abs/early-evolution-of-purple-retinal-pigments-on-earth-and-implications-for-exoplanet-biosignatures/"
    image_prompt: "Relevant editorial image of early Earth with purple microbial mats along shallow water, astrobiology concept art, no text, no logos."

  - id: moon_tree_seeds
    text_he: |
      במשימת אפולו 14 האסטרונאוט סטיוארט רוזה לקח איתו מאות זרעי עצים סביב הירח.
      אחרי החזרה הם הונבטו ונשתלו בארצות הברית ובעולם כ"עצי ירח".
      חלקם עדיין חיים — מזכרת בוטנית ממסע חלל.
    source: "NASA Moon Trees archive, Apollo 14 seed experiment (1971)."
    source_url: "https://nssdc.gsfc.nasa.gov/planetary/lunar/moon_tree.html"
    image_prompt: "Relevant editorial image of a mature Moon Tree with Apollo 14 lunar orbit imagery in the background, documentary NASA style, no text, no logos."

  - id: apollo_guidance_memory
    text_he: |
      מחשב ההנחיה של אפולו השתמש בזיכרון ליבה שנטווה פיזית בחוטים.
      נשים במפעל ריית'יאון שזרו חוטים דרך טבעות מגנטיות; מעבר דרך טבעת היה 1, עקיפה הייתה 0.
      הקוד שהנחית אנשים על הירח היה גם מלאכת יד מדויקת.
    source: "MIT Museum Apollo Guidance Computer collection; NASA History Office."
    source_url: "https://www.nasa.gov/history/afj/compessay.html"
    image_prompt: "Relevant editorial image of Apollo rope memory being woven through magnetic cores by technicians, 1960s aerospace documentary style, no text, no logos."

  - id: qwerty_not_speed
    text_he: |
      סידור QWERTY לא נולד כדי להאט הקלדה, בניגוד למיתוס הנפוץ.
      ההיסטוריה של מכונות הכתיבה מצביעה על שילוב של מגבלות מכניות, זוגות אותיות נפוצים, והצרכים של אנשי טלגרף.
      לפעמים תקן עולמי מתחיל פשוט כפשרה שנדבקת טוב מדי.
    source: "Yasuoka & Yasuoka, 'On the Prehistory of QWERTY', Zinbun (2011); Smithsonian Magazine history coverage."
    source_url: "https://www.smithsonianmag.com/innovation/fact-of-fiction-the-legend-of-the-qwerty-keyboard-49863249/"
    image_prompt: "Relevant editorial image of an early Sholes and Glidden typewriter keyboard mechanism, industrial history style, no text, no logos."

  - id: barcode_first_scan_gum
    text_he: |
      הברקוד המסחרי הראשון שנסרק בקופה היה חבילת מסטיק Wrigley's Juicy Fruit.
      זה קרה ב-26 ביוני 1974 בסופרמרקט באוהיו.
      החבילה נמצאת היום במוזיאון הסמית'סוניאן — רגע קטן שהפך את כל הקמעונאות לממוחשבת.
    source: "Smithsonian National Museum of American History, UPC barcode first scan collection."
    source_url: "https://americanhistory.si.edu/collections/search/object/nmah_999124"
    image_prompt: "Relevant editorial image of a 1974 supermarket checkout scanning Juicy Fruit gum with an early UPC barcode, no readable brand text, no logos."

  - id: lego_precision_molds
    text_he: |
      קוביות LEGO מיוצרות בדיוק של מיקרונים בודדים, ולכן קובייה חדשה יכולה להתחבר לקובייה מלפני עשרות שנים.
      החברה מתארת סבילות ייצור של כאלפית המילימטר בחלקים קריטיים.
      הצעצוע עובד כי הוא בעצם מערכת הנדסה מדויקת מאוד.
    source: "LEGO Group manufacturing quality materials; Smithsonian Magazine LEGO history coverage."
    source_url: "https://www.lego.com/en-us/history/articles/d-quality-in-every-brick"
    image_prompt: "Relevant editorial macro image of interlocking plastic bricks with precision mold details and calipers, product engineering style, no logos, no text."

  - id: library_of_congress_tweets
    text_he: |
      ב-2010 ספריית הקונגרס האמריקאית הודיעה שתשמור את כל הציוצים הציבוריים מטוויטר.
      עד 2017 הארכיון כבר היה עצום מדי לשימוש מעשי, והספרייה עברה לשמירה סלקטיבית בלבד.
      לפעמים שימור דיגיטלי נכשל לא כי אין מידע — אלא כי יש יותר מדי.
    source: "Library of Congress blog, Twitter archive update (2017); LOC press release (2010)."
    source_url: "https://blogs.loc.gov/loc/2017/12/update-on-the-twitter-archive-at-the-library-of-congress-2/"
    image_prompt: "Relevant editorial image of a massive digital archive visualized as shelves of social media messages in the Library of Congress, no text, no logos."

  - id: first_webcam_coffee
    text_he: |
      מצלמת הרשת הראשונה נועדה לפתור בעיה זעירה: האם נשאר קפה בקומקום במעבדת קיימברידג'.
      חוקרים כיוונו מצלמה אל Trojan Room coffee pot כדי לא ללכת לשווא במסדרון.
      אחד הסמלים של האינטרנט התחיל מעצלנות מוצדקת סביב קפה.
    source: "University of Cambridge Computer Laboratory, Trojan Room coffee pot history."
    source_url: "https://www.cl.cam.ac.uk/coffee/coffee.html"
    image_prompt: "Relevant editorial image of an early 1990s computer lab webcam pointed at a coffee pot, retro internet history style, no text, no logos."

  - id: pangolin_scales_keratin
    text_he: |
      קשקשי פנגולין עשויים קרטין — אותו חלבון שמרכיב שיער וציפורניים אצל בני אדם.
      למרות זאת, הם יוצרים שריון גמיש שמאפשר לחיה להתגלגל לכדור כמעט בלתי חדיר.
      חומר יומיומי בגוף אחד הופך למבצר בגוף אחר.
    source: "Smithsonian National Zoo pangolin facts; World Wildlife Fund pangolin conservation materials (2024)."
    source_url: "https://nationalzoo.si.edu/animals/pangolin"
    image_prompt: "Relevant editorial image of a pangolin curled into a protective ball, close view of keratin scales, wildlife documentary style, no text, no logos."

  - id: narwhal_tusk_sensor
    text_he: |
      ה"קרן" של חדקרן הים היא בעצם שן שמאלית עליונה שגדלה דרך השפה.
      מחקרים מצאו בתוכה מיליוני תעלות עצב זעירות, שמאפשרות כנראה לחוש שינויי מליחות וטמפרטורה במים.
      זה לא חרב; זה איבר חישה ארוך ומוזר מאוד.
    source: "Nweeia et al., Anatomical Record (2014); Smithsonian Ocean narwhal tusk materials."
    source_url: "https://ocean.si.edu/ocean-life/marine-mammals/narwhal-tusk"
    image_prompt: "Relevant editorial image of a narwhal tusk cross-section revealing sensory channels in Arctic water, marine science style, no text, no logos."

  - id: cuttlefish_3d_glasses
    text_he: |
      דיונוני רחף עברו ניסוי עם משקפי תלת-ממד זעירים שהודבקו להם בעדינות.
      הם צפו בטרף מדומה על מסך והתאימו את מרחק התקיפה לפי עומק התמונה.
      גם יצור עם מוח שונה לגמרי משלנו משתמש בראייה דו-עינית לחישוב מרחק.
    source: "Feord et al., Science Advances (2020), cuttlefish stereopsis experiment."
    source_url: "https://www.science.org/doi/10.1126/sciadv.aay6036"
    image_prompt: "Relevant editorial image of a cuttlefish wearing tiny 3D glasses in a marine cognition experiment, respectful science style, no text, no logos."

  - id: mouse_utopia_experiment
    text_he: |
      בניסוי "יקום 25" של ג'ון קלהון, עכברים קיבלו מזון, מים ומרחב מוגן — ואז החברה שלהם קרסה כשהצפיפות החברתית עלתה.
      הפרשנות הפופולרית מוגזמת לעיתים, אבל הניסוי השפיע עמוקות על דיון עירוניות, לחץ חברתי והתנהגות.
      אוטופיה קטנה שהפכה למשל מדעי לא נוח.
    source: "Calhoun, Proceedings of the Royal Society of Medicine (1973); National Institute of Mental Health history."
    source_url: "https://royalsocietypublishing.org/doi/10.1098/rspb.1973.0050"
    image_prompt: "Relevant editorial image of a 1970s behavioral research mouse enclosure with geometric compartments, documentary lab style, no text, no logos."

  - id: ancient_egyptian_blue
    text_he: |
      כחול מצרי הוא אחד הפיגמנטים הסינתטיים הראשונים בעולם.
      המצרים ייצרו אותו מחול, נחושת, סיד וחומר אלקלי בחימום גבוה כבר לפני יותר מ-4,500 שנה.
      תחת אור אינפרה-אדום הוא אפילו זוהר, ולכן מוזיאונים משתמשים בזה כדי לזהות עקבות צבע עתיק.
    source: "British Museum technical research on Egyptian blue; Verri, British Museum Technical Research Bulletin (2009)."
    source_url: "https://www.britishmuseum.org/blog/egyptian-blue-oldest-known-artificial-pigment"
    image_prompt: "Relevant editorial image of ancient Egyptian blue pigment glowing under infrared light on a museum artifact, conservation science style, no text, no logos."

  - id: maya_blue_durable
    text_he: |
      כחול מאיה נשאר בהיר מאות שנים בגשם, חום ולחות טרופית.
      הסוד הוא שילוב של צבע אינדיגו עם חימר פליגורסקיט, שיוצר מבנה יציב במיוחד.
      פיגמנט שנראה עדין מתנהג כמו טכנולוגיית חומרים מתקדמת.
    source: "Chiari et al., Applied Clay Science (2008); Getty Conservation Institute research on Maya Blue."
    source_url: "https://www.getty.edu/conservation/publications_resources/newsletters/22_1/maya_blue.html"
    image_prompt: "Relevant editorial image of Maya blue pigment on ancient mural fragments with clay mineral structure visualized, conservation science style, no text, no logos."

  - id: lichens_space_survival
    text_he: |
      חזזיות מסוימות שרדו חשיפה ישירה לחלל מחוץ לתחנת החלל הבינלאומית.
      בניסוי של סוכנות החלל האירופית הן עמדו בוואקום, קרינה וקור קיצוני, ואז חזרו לפעילות פוטוסינתטית אחרי החזרה.
      החיים, לפחות בכמה צורות, הרבה יותר קשוחים ממה שנוח לדמיין.
    source: "Sancho et al., Astrobiology (2007); European Space Agency EXPOSE experiment materials."
    source_url: "https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/Research/Lichen_survives_in_space"
    image_prompt: "Relevant editorial image of lichens mounted outside the International Space Station against Earth, astrobiology experiment style, no text, no logos."

  - id: immortal_jellyfish_cycle
    text_he: |
      המדוזה Turritopsis dohrnii יכולה לחזור משלב בוגר לשלב פוליפ צעיר בתנאי לחץ.
      זה לא אומר שהיא "לא מתה" בטבע — טורפים ומחלות עדיין קיימים — אבל מחזור החיים שלה יכול להתהפך ביולוגית.
      במקום להזדקן קדימה בלבד, היא יודעת ללחוץ על חזרה.
    source: "Piraino et al., Biological Bulletin (1996); Smithsonian Ocean immortal jellyfish overview."
    source_url: "https://ocean.si.edu/ocean-life/invertebrates/immortal-jellyfish"
    image_prompt: "Relevant editorial image of Turritopsis dohrnii jellyfish life cycle reversing into a polyp, marine biology illustration style, no text, no logos."

  - id: radioactive_boar_bavaria
    text_he: |
      חזירי בר בבוואריה נשארו רדיואקטיביים שנים אחרי צ'רנוביל יותר מבעלי חיים אחרים.
      מחקר מ-2023 הראה שחלק גדול מהזיהום מגיע גם מניסויי נשק גרעיני ישנים, דרך פטריות תת-קרקעיות שהחזירים אוכלים.
      ההיסטוריה הגרעינית מתחבאת לפעמים ביער ובצלחת.
    source: "Stäger et al., Environmental Science & Technology (2023), Bavarian wild boar radiocesium study."
    source_url: "https://pubs.acs.org/doi/10.1021/acs.est.3c03565"
    image_prompt: "Relevant editorial image of Bavarian wild boar foraging for underground mushrooms with subtle radiation mapping overlay, no text, no logos."

  - id: tardigrade_moon_crash
    text_he: |
      ב-2019 חללית בראשית התרסקה על הירח כשהיא נושאת ארכיון קטן ובו גם דובוני מים מיובשים.
      אין ראיה שהם "חיים על הירח" — בלי מים ומזון הם לא פעילים — אבל ייתכן שחלקם שרדו במצב רדום.
      זו תזכורת מוזרה לכך שגם כישלון נחיתה יכול להשאיר ביולוגיה מאחור.
    source: "Wired report on Arch Mission Foundation lunar library (2019); SpaceIL Beresheet mission materials."
    source_url: "https://www.wired.com/story/a-crashed-israeli-lunar-lander-spilled-tardigrades-on-the-moon/"
    image_prompt: "Relevant editorial image of a tiny lunar archive capsule after a spacecraft crash with dormant tardigrades imagined microscopically, no text, no logos."

  - id: oldest_known_cheese
    text_he: |
      בקבר מצרי בן כ-3,200 שנה נמצא גוש לבן שהתברר כגבינה עתיקה.
      ניתוח חלבונים זיהה חלב מפרות, כבשים או עזים, וגם סימנים אפשריים לחיידק ברוצלה.
      הגבינה הארכיאולוגית העתיקה בעולם אולי הייתה גם סיכון בריאותי לא קטן.
    source: "Greco et al., Analytical Chemistry (2018), ancient Egyptian cheese protein analysis."
    source_url: "https://pubs.acs.org/doi/10.1021/acs.analchem.8b02535"
    image_prompt: "Relevant editorial image of an ancient Egyptian tomb jar with preserved cheese residue under laboratory analysis, no text, no logos."

  - id: tardigrade_quantum_claim_caveat
    text_he: |
      ב-2021 פורסם מאמר שטען לדובון מים במצב קוונטי משולב עם קיוביט מוליך-על.
      פיזיקאים רבים חלקו על הפרשנות: הניסוי היה אמיתי, אבל השאלה אם היצור עצמו היה "שזור קוונטית" נשארה שנויה במחלוקת.
      לפעמים הכותרת המדעית מרגשת יותר מהקונצנזוס.
    source: "Lee et al., arXiv (2021); Physics World and Science commentary on quantum tardigrade debate."
    source_url: "https://arxiv.org/abs/2112.07978"
    image_prompt: "Relevant editorial image of a tardigrade near a superconducting qubit chip with cautious science visualization, no text, no logos."

  - id: roman_dodecahedra_unknown
    text_he: |
      מאות דודקהדרונים רומיים מברונזה נמצאו ברחבי אירופה, בעיקר בצפון-מערב האימפריה.
      אין טקסט עתיק שמסביר למה שימשו: כלי מדידה, חפץ פולחני, משחק, או משהו אחר.
      לפעמים ארכיאולוגיה משאירה אובייקט מושלם בלי הוראות הפעלה.
    source: "British Museum collection notes on Roman dodecahedra; Portable Antiquities Scheme records."
    source_url: "https://www.britishmuseum.org/collection/object/H_1994-0408-1"
    image_prompt: "Relevant editorial image of a Roman bronze dodecahedron on a museum table with calipers and excavation notes, no text, no logos."

spooky:
  - id: dybbuk_origin
    text_he: |
      הדיבוק לא התחיל כמפלצת קולנועית, אלא כרעיון קבלי: נשמה שלא מצאה תיקון ונאחזת בגוף חי כדי להשלים משהו שנשאר פתוח.
      במאות ה-16 וה-17 הסיפורים האלה התחילו לקבל צורה ברורה בקהילות יהודיות, עם טקסים, עדים, ורבנים שניסו להוציא את הנשמה בדיבור ולא בכוח.
      פרופ' יוסי חיות מאוניברסיטת חיפה מציין שגם המילה עצמה באה מיידיש — "דיבוק" כמשהו שנדבק — וברוב הסיפורים הקלאסיים מי שנושאת את הקול הזר היא אישה צעירה.
      זה מפחיד דווקא כי הוא לא מתאר שד מבחוץ, אלא קול של מת שמדבר מתוך מישהו שהכרתם רגע קודם.
    source: "Yossi Chajes interview, Atlas Obscura (2018); 'The Power of a Tale: Stories from the Israel Folktale Archives' (Wayne State Univ. Press, 2019)."
    source_url: "https://www.atlasobscura.com/articles/what-is-a-dybbuk"
    image_prompt: "Relevant atmospheric editorial image of old Jewish folklore manuscripts and a shadowy figure in candlelight, respectful historical style, no text, no logos."

  - id: voynich_unread
    text_he: |
      כתב היד של וויניץ' (Voynich Manuscript) שוכן בספריית ביינקה של ייל. 234 עמודים מאיירים בצמחים שלא קיימים, נשים בתוך אמבטיות מחוברות בצינורות, מפות אסטרונומיות.
      הטקסט נכתב בשפה לא ידועה, באלפבית לא ידוע, על קלף שמתוארך פחמנית למאה ה-15.
      600 שנה. מתמטיקאים, קריפטוגרפים של MI6 ו-NSA, אקדמאים. אף אחד לא קרא מילה.
    source: "Yale Beinecke Library MS 408. Multiple cipher attempts documented; Lisa Fagin Davis, Cipher Mysteries blog."
    source_url: "https://collections.library.yale.edu/catalog/2002046"
    image_prompt: "Relevant editorial image of the Voynich manuscript open to botanical and astronomical diagrams in a rare book library, no readable text, no logos."

  - id: dyatlov_pass
    text_he: |
      בלילה של ה-2 בפברואר 1959, תשעה סטודנטים סובייטים שהקימו אוהל בהר אוּראל הצפוני קרעו את האוהל מבפנים, ברחו במינוס 30, וכולם מתו לפני שהגיעו לעצים.
