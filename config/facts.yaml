      לפי היסטוריוני רפואה, מסכת הרופא עם המקור הארוך מזוהה עם המגפה השחורה, אבל הופיעה בעיקר מאוחר יותר, במאות ה-17 וה-18.
      המקור מולא בעשבים ובחומרים ריחניים כי חשבו שמחלות עוברות דרך אוויר מסריח.
      הדימוי הכי מפורסם של המגפה הוא בעצם טכנולוגיית פחד מתקופה אחרת.
