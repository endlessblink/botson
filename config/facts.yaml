      במשך מאות שנים השתמשו אמנים אירופים בפיגמנט בשם Mummy Brown, שיוצר לעיתים מגופות חנוטות טחונות.
      לפי מקורות היסטוריים, הצבע נמכר בחנויות חומרי אמנות עד שהמודעות למקורו הפכה אותו לבלתי נסבל מוסרית.
      לפעמים החומר שממנו עשויה תמונה יפה הוא הסיפור הכי אפל בה.
