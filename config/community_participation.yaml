# Public defaults stay off. Shared dashboard/agent configuration activates only
# explicitly approved existing topics. Runtime state survives deployment.
revision: 0
audit: []
runtime:
  reload_seconds: 5
  context_messages: 10
  context_max_chars: 2400
  max_reply_chars: 240
  max_news_chars: 420
  max_feed_bytes: 524288
  max_articles_per_source: 3
  max_candidates_per_cycle: 2
  max_sends_per_cycle: 1
  fetch_timeout_seconds: 15
topic_news:
  enabled: false
  mode: preview_only
  timezone: null
  dedupe_scope: null  # Explicit choice: chat or topic; no automatic routing.
  sources: {}
  topic_sources: {}
  freshness_hours: null
  verification_max_age_hours: null
  context_max_age_minutes: null
  minimum_relevance: null
  global_daily_cap: null
  topic_daily_cap: null
  quiet_hours: null
  times: []

occasional_replies:
  enabled: false
  mode: needs_decision
  timezone: null
  allowed_topics: []
  allow_unsolicited: false
  minimum_value: null
  global_daily_cap: null
  topic_daily_cap: null
  thread_daily_cap: null
  cooldown_minutes: null
  cooldown_scope: null  # Explicit choice: topic or conversation.
  context_max_age_minutes: null
  quiet_hours: null
