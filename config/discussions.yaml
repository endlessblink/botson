art:
- על מה אתם עובדים עכשיו? שתפו!
- מה המדיום האהוב עליכם? (ציור, דיגיטל, חימר, וכו')
- אמן/ית שמשפיע/ה עליכם?
- מה הפרויקט הכי שאפתני שעשיתם?
- טיפ אחד ליצירתיים מתחילים?
- שתפו משהו שיצרתם לאחרונה! 🎨
- מה מעורר לכם השראה?
- ציוד/כלי שאתם ממליצים עליו?
- תערוכה / גלריה ששווה לבקר?
- איך אתם מתמודדים עם בלוק יצירתי?
cute:
- שתפו את הדבר הכי חמוד שראיתם היום!
- חיית מחמד — יש? איזו? שתפו תמונה! 📸
- מה החיה הכי חמודה בטבע לדעתכם?
- סרטון חמוד שהצחיק / חימם אתכם לאחרונה?
- כלב או חתול ולמה? (או שניהם!)
- מה הדבר הכי חמוד שחיית המחמד שלכם עשתה?
- תמונת חמידות אקראית — גו! 📷
- מה המקום הכי חמוד שביקרתם?
- פרווה, נוצות או קשקשים — מה האהוב עליכם?
- שתפו מם חמוד 😊
funny:
- מה הדבר הכי מביך שקרה לכם?
- ספרו בדיחה — הכי גרועה שיש! 😂
- מה המם הכי טוב שראיתם לאחרונה?
- מה הדבר הכי מצחיק שילד אמר לכם? (ironic, we know 😏)
- שתפו סרטון מצחיק!
- מה המשפט הכי ישראלי שאתם מכירים?
- מה ה-autocorrect הכי מביך שקרה לכם?
- מה הדבר הכי אבסורדי שראיתם השבוע?
- אם החיים שלכם היו סיטקום, מה היה השם?
- ספרו סיפור מצחיק מהשירות הצבאי / עבודה 😂
gaming:
- מה המשחק מחשב שהכי אכל לכם את החיים?
- PC, קונסולה או שניהם?
- מה משחק הלוח האהוב עליכם?
- אם הייתם יכולים לשחק רק משחק אחד לנצח, מה הוא?
- מה המשחק שהכי ציפיתם לו והתאכזבתם?
- משחק שחשבתם שלא תאהבו ובסוף התמכרתם?
- מה הג'אנר האהוב עליכם במשחקים?
- משחק אינדי מומלץ?
- מה המשחק הכי טוב שיצא השנה?
- מישהו רוצה לקבוע ערב משחקי לוח / גיימינג? 🎮
general:
- אם הייתם יכולים לגור בכל מקום בעולם, איפה הייתם בוחרים ולמה?
- מה הדבר הכי מוזר שקניתם באונליין?
- מה ההרגל הכי טוב שפיתחתם בשנה האחרונה?
- מה הדבר שאנשים תמיד מופתעים לגלות עליכם?
- אם הייתם יכולים ללמוד מיומנות חדשה ברגע, מה זה היה?
- מה הטיול הכי טוב שעשיתם?
- מה השיר שאתם לא יכולים להפסיק לשמוע לאחרונה?
- מה הדבר הכי overrated לדעתכם?
- מה הדבר הכי underrated לדעתכם?
- אם הייתם יכולים לאכול ארוחת ערב עם כל אדם בהיסטוריה, מי זה היה?
- מה הפודקאסט / ערוץ יוטיוב שאתם ממליצים עליו?
- מה הדבר הכי טוב בלחיות בלי ילדים? 😎
movies:
- מה הסדרה שאתם צופים בה עכשיו?
- סרט שראיתם יותר מ-3 פעמים?
- מה הסדרה הכי טובה שראיתם אי פעם?
- סרט שגרם לכם לבכות?
- מה הסרט הכי מוערך יותר מדי?
- סרט/סדרה ישראלית שווה?
- מה הסדרה שאתם ממליצים שאף אחד לא מכיר?
- דוקומנטרי טוב לסוף שבוע?
- מה הסצנה הכי אייקונית בקולנוע?
- נטפליקס, דיסני+, או משהו אחר?
politics:
- מה הנושא שהכי מעסיק אתכם בתקופה האחרונה?
- פודקאסט / ערוץ חדשות שאתם ממליצים?
- ספר שעזר לכם להבין את העולם טוב יותר?
- מה הנושא שלדעתכם לא מדברים עליו מספיק?
- איך אתם שומרים על בריאות נפשית מול החדשות?
- מה לדעתכם השינוי הכי חשוב שצריך לקרות?
- דעה לא פופולרית שלכם?
- איך אתם מתמודדים עם ויכוחים פוליטיים עם משפחה?
- ארגון / עמותה ששווה להכיר?
- מה מקור החדשות הכי אמין לדעתכם?
singles:
- מה הדבר הכי טוב שגיליתם על עצמכם מאז שאתם בחיים עצמאיים / בלי זוגיות קבועה?
- מה התכונה הכי חשובה לכם בפרטנר?
- הדייט הכי מוזר שהיה לכם?
- אפליקציות דייטינג — כן או לא?
- מה הפעילות האידיאלית לדייט ראשון?
- מה ה-red flag הכי גדול בדייט?
- מה ה-green flag שגורם לכם לאהוב מישהו מיד?
- מה עושים בערב שישי כסינגלים? 🎉
- טיפ אחד לדייטינג?
- מתנה הכי טובה שקיבלתם מפרטנר?
vegan:
- מה המתכון הכי טוב שגיליתם לאחרונה?
- מסעדה טבעונית/צמחונית מומלצת?
- מה המנה שאנשים הכי מופתעים שהיא טבעונית?
- טיפ אחד למי שמתחיל/ה לאכול יותר צמחוני?
- מה המוצר הטבעוני שהכי הפתיע אתכם?
- ארוחת בוקר טבעונית אהובה?
- מה הספר / דוקו שהכי השפיע על הבחירה שלכם?
- חטיף טבעוני אהוב?
- מה הדבר הכי קשה בלהיות טבעוני/ת בישראל?
- מתכון לשבת שמומלץ לנסות?
