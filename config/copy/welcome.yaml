public_batch: |-
  👋 הצטרפו אלינו לאחרונה אנשים חדשים — ברוכים הבאים!

  איזה ערוץ הייתם ממליצים למי שהצטרף עכשיו לפתוח קודם? שם אחד מספיק 🙂
  אפשר להכיר בשקט, בלי למהר להציג את עצמכם 🌿
dm_single: |-
  היי {name}! 👋 ברוך/ה הבא/ה לאלהוריים וזה!

  אנחנו קהילה של אנשים שבחרו לחיות בלי ילדים — מקום לשיח פתוח, תמיכה, והנאה בלי שיפוטיות. 🌟

  הנה כמה ערוצים שווים להציץ בהם:

  🎮 גיימינג + משחקי לוח
  📺 סרטים סדרות וכו
  🎨 ערוץ אומנות ויצירה
  🐕 כל מה שחמוד
  😂 מצחיק / מגניב
  💌 אל הוריים/יות מכירים
  🌱 טבעונים וצמחוניים
  🌍 פוליטיקה / גיאו-פוליטיקה
  🌟 יום יום — הישגים ומטרות יומיות

  אם מתאים, אפשר לכתוב בערוץ מצטרפים חדשים + עדכונים איזה נושא מעניין אותך — אפילו מילה אחת מספיקה 💬

  ואם נוח יותר להכיר קודם בשקט, זה לגמרי בסדר 🌿
rules: |-
  📋 כללי הקהילה:

  • כבוד הדדי — בלי התקפות אישיות או זלזול
  • אין ספאם או פרסום עצמי
  • כל נושא בערוץ המתאים
  • אין הטרדות בהודעות פרטיות — מי שעושה זאת יורחק מהקבוצה ⛔
