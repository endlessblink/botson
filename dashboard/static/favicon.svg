<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#171723"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#2a2a4a" stroke-width="1"/>
  <!-- Head -->
  <rect x="8" y="6" width="16" height="14" rx="4" fill="#3b82f6"/>
  <!-- Eyes -->
  <circle cx="13" cy="13" r="2" fill="#0f0f17"/>
  <circle cx="19" cy="13" r="2" fill="#0f0f17"/>
  <!-- Eye shine -->
  <circle cx="13.7" cy="12.3" r="0.7" fill="#93c5fd"/>
  <circle cx="19.7" cy="12.3" r="0.7" fill="#93c5fd"/>
  <!-- Mouth -->
  <rect x="12" y="16" width="8" height="1.5" rx="0.75" fill="#0f0f17"/>
  <!-- Antenna -->
  <line x1="16" y1="6" x2="16" y2="3" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="2.5" r="1.5" fill="#60a5fa"/>
  <!-- Body -->
  <rect x="11" y="22" width="10" height="5" rx="2" fill="#3b82f6"/>
  <!-- Arms -->
  <rect x="6" y="23" width="4" height="2" rx="1" fill="#2563eb"/>
  <rect x="22" y="23" width="4" height="2" rx="1" fill="#2563eb"/>
</svg>
