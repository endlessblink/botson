<!doctype html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trivia Live Demo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Heebo', 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(circle at top, rgba(251, 191, 36, 0.12), transparent 28%),
        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.16), transparent 30%),
        #09090b;
    }
    :root {
      --tg-bg: var(--tg-theme-bg-color, #09090b);
      --tg-text: var(--tg-theme-text-color, #f4f4f5);
      --tg-hint: var(--tg-theme-hint-color, #71717a);
      --tg-section: var(--tg-theme-secondary-bg-color, rgba(24, 24, 27, 0.92));
      --tg-button: var(--tg-theme-button-color, #3b82f6);
    }
    body { color: var(--tg-text); }
    .panel { background: var(--tg-section); }
    .glass { backdrop-filter: blur(10px); }
    .pulse-ring {
      box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.35);
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.35); }
      70% { box-shadow: 0 0 0 14px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
  </style>
</head>
<body class="text-zinc-100 px-3 py-3">
  <div class="max-w-md mx-auto space-y-3">
    <section class="panel glass rounded-3xl border border-white/10 p-4 shadow-2xl shadow-black/30">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <div class="text-[11px] uppercase tracking-[0.2em] text-amber-300/80 mb-1">Mini App Prototype</div>
          <h1 id="title" class="text-xl font-black leading-tight"></h1>
          <p id="subline" class="text-sm text-zinc-400 mt-1"></p>
        </div>
        <div class="text-left shrink-0">
          <div class="text-[11px] text-zinc-500">מתחיל ב</div>
          <div id="starts-at" class="text-lg font-black text-blue-300"></div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 text-center">
          <div class="text-[11px] text-zinc-500">שחקנים</div>
          <div id="players-count" class="text-lg font-black mt-1"></div>
        </div>
        <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 text-center">
          <div class="text-[11px] text-zinc-500">מקום שלך</div>
          <div id="you-rank" class="text-lg font-black mt-1"></div>
        </div>
        <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 text-center">
          <div class="text-[11px] text-zinc-500">ניקוד</div>
          <div id="you-score" class="text-lg font-black mt-1"></div>
        </div>
      </div>

      <div class="rounded-[28px] bg-gradient-to-br from-zinc-950 via-zinc-900 to-zinc-950 border border-zinc-800 p-4 min-h-[350px]">
        <div class="flex items-center justify-between mb-3">
          <div id="stage-pill" class="text-xs font-bold rounded-full px-3 py-1 bg-blue-500/15 text-blue-200 border border-blue-400/20"></div>
          <div id="countdown-wrap" class="hidden items-center gap-2">
            <div class="w-11 h-11 rounded-full bg-blue-500/15 border border-blue-400/20 flex items-center justify-center pulse-ring">
              <span id="countdown" class="font-black text-blue-200"></span>
            </div>
          </div>
        </div>

        <div id="main-surface" class="space-y-3"></div>
      </div>
    </section>

    <section class="panel glass rounded-3xl border border-white/10 p-4 shadow-xl shadow-black/25">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-sm font-bold">לוח תוצאות חי</h2>
          <p class="text-xs text-zinc-500 mt-0.5">מוביל/ה למעלה, שינויי מיקום בזמן אמת</p>
        </div>
        <div class="text-xs text-emerald-300 font-semibold">LIVE</div>
      </div>
      <div id="leaderboard" class="space-y-2"></div>
    </section>

    <section class="panel glass rounded-3xl border border-white/10 p-4 shadow-xl shadow-black/25">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-bold">איך זה יעבוד בזמן אמת</h2>
          <p class="text-xs text-zinc-500 mt-0.5">המסך הזה מחליף בין חדר המתנה, שאלה, חשיפה ולידרבורד.</p>
        </div>
        <button id="next-stage" type="button" class="rounded-full bg-white text-zinc-900 px-3 py-1.5 text-xs font-bold">המסך הבא</button>
      </div>
    </section>
  </div>

  <script>
    const DEMO = {{ demo_json|safe }};
    const state = {
      stageIndex: 0,
      selectedAnswer: null,
    };

    const els = {
      title: document.getElementById("title"),
      subline: document.getElementById("subline"),
      startsAt: document.getElementById("starts-at"),
      playersCount: document.getElementById("players-count"),
      youRank: document.getElementById("you-rank"),
      youScore: document.getElementById("you-score"),
      stagePill: document.getElementById("stage-pill"),
      countdownWrap: document.getElementById("countdown-wrap"),
      countdown: document.getElementById("countdown"),
      mainSurface: document.getElementById("main-surface"),
      leaderboard: document.getElementById("leaderboard"),
      nextStage: document.getElementById("next-stage"),
    };

    function playTone(kind) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = kind === "success" ? "triangle" : "sawtooth";
      osc.frequency.value = kind === "success" ? 880 : 220;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.24);
      osc.onended = () => ctx.close();
    }

    function renderLeaderboard(players) {
      els.leaderboard.innerHTML = players.map((player, index) => {
        const tone = player.status === "leader"
          ? "bg-amber-500/15 border-amber-400/25 text-amber-200"
          : "bg-zinc-950/60 border-zinc-800 text-zinc-100";
        const delta = player.status === "up" ? "▲" : player.status === "down" ? "▼" : "•";
        return `
          <div class="rounded-2xl border ${tone} px-3 py-2 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-7 h-7 rounded-full ${index === 0 ? "bg-amber-400 text-zinc-950" : "bg-zinc-800 text-zinc-300"} flex items-center justify-center text-xs font-black shrink-0">${index + 1}</div>
              <div class="min-w-0">
                <div class="font-bold truncate">${player.name}</div>
                <div class="text-[11px] text-zinc-500">רצף ${player.streak} · ${delta}</div>
              </div>
            </div>
            <div class="text-left shrink-0">
              <div class="text-lg font-black">${player.score}</div>
              <div class="text-[10px] text-zinc-500">נק׳</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function answerButton(answer, index) {
      const selected = state.selectedAnswer === index;
      const stage = DEMO.stages[state.stageIndex];
      let cls = "bg-zinc-900 border-zinc-800 text-zinc-100 hover:bg-zinc-800";
      if (stage.kind === "reveal") {
        if (answer.label === stage.correct_answer) cls = "bg-emerald-500/15 border-emerald-400/30 text-emerald-200";
        else if (selected) cls = "bg-rose-500/15 border-rose-400/30 text-rose-200";
      } else if (selected) {
        cls = "bg-blue-500/15 border-blue-400/30 text-blue-200";
      }
      return `
        <button type="button" data-answer-index="${index}" class="answer-btn w-full text-right rounded-2xl border px-4 py-3 transition ${cls}">
          <div class="text-[11px] text-zinc-500 mb-1">תשובה ${index + 1}</div>
          <div class="font-semibold leading-snug">${answer.label}</div>
        </button>
      `;
    }

    function renderStage() {
      const stage = DEMO.stages[state.stageIndex];
      const players = DEMO.players;
      const playerCount = players.length;
      const youRank = stage.you_rank || 2;
      const youScore = stage.you_score || 121;

      els.title.textContent = DEMO.title;
      els.subline.textContent = stage.subline;
      els.startsAt.textContent = DEMO.starts_at;
      els.playersCount.textContent = playerCount;
      els.youRank.textContent = `#${youRank}`;
      els.youScore.textContent = `${youScore}`;
      els.stagePill.textContent = ({
        lobby: "חדר המתנה",
        question: "שאלה חיה",
        reveal: "חשיפת תשובה",
        leaderboard: "לידרבורד",
        final: "סיום",
      })[stage.kind] || stage.kind;

      els.countdownWrap.classList.toggle("hidden", stage.kind !== "question");
      if (stage.kind === "question") {
        els.countdownWrap.classList.add("flex");
        els.countdown.textContent = stage.countdown;
      } else {
        els.countdownWrap.classList.remove("flex");
      }

      if (stage.kind === "lobby") {
        els.mainSurface.innerHTML = `
          <div class="rounded-3xl border border-zinc-800 bg-zinc-950/60 p-4">
            <div class="text-sm text-zinc-400 mb-2">${stage.headline}</div>
            <div class="text-lg font-black mb-3">${DEMO.host} פותח/ת את הסיבוב עוד רגע</div>
            <div class="flex flex-wrap gap-2 mb-4">
              ${DEMO.players.map((player) => `<span class="rounded-full bg-zinc-900 border border-zinc-800 px-3 py-1 text-sm">${player.name}</span>`).join("")}
            </div>
            <button class="w-full rounded-2xl bg-blue-500 text-white px-4 py-3 font-black">${stage.cta}</button>
          </div>
        `;
      } else if (stage.kind === "question") {
        els.mainSurface.innerHTML = `
          <div class="text-sm text-zinc-400">${stage.headline}</div>
          <div class="text-xl font-black leading-tight">${stage.question}</div>
          <div class="grid grid-cols-1 gap-2 pt-2">
            ${stage.answers.map(answerButton).join("")}
          </div>
        `;
      } else if (stage.kind === "reveal") {
        els.mainSurface.innerHTML = `
          <div class="text-sm text-zinc-400">${stage.headline}</div>
          <div class="text-xl font-black leading-tight">${stage.question}</div>
          <div class="rounded-2xl bg-emerald-500/12 border border-emerald-400/25 p-4 mt-2">
            <div class="text-xs text-emerald-300 mb-1">תשובה נכונה</div>
            <div class="font-black text-lg text-emerald-100">${stage.correct_answer}</div>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3">
              <div class="text-[11px] text-zinc-500">תוצאה</div>
              <div class="text-lg font-black text-emerald-200">+${stage.score_delta} נק׳</div>
            </div>
            <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3">
              <div class="text-[11px] text-zinc-500">שינוי מיקום</div>
              <div class="text-lg font-black text-blue-200">${stage.rank_delta}</div>
            </div>
          </div>
        `;
      } else if (stage.kind === "leaderboard") {
        els.mainSurface.innerHTML = `
          <div class="text-sm text-zinc-400">${stage.headline}</div>
          <div class="rounded-3xl border border-zinc-800 bg-zinc-950/60 p-4 mt-2 text-center">
            <div class="text-xs text-zinc-500 mb-1">השחקן הבולט כרגע</div>
            <div class="text-3xl font-black">${stage.focus_player}</div>
            <div class="text-sm text-zinc-400 mt-2">עלה/תה מקום אחרי תשובה מהירה ונכונה.</div>
          </div>
        `;
      } else if (stage.kind === "final") {
        els.mainSurface.innerHTML = `
          <div class="text-sm text-zinc-400">${stage.headline}</div>
          <div class="grid grid-cols-3 gap-2 mt-3 items-end">
            <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3 text-center order-2">
              <div class="text-xs text-zinc-500">מקום שני</div>
              <div class="font-black mt-1">${stage.podium[1]}</div>
            </div>
            <div class="rounded-2xl bg-amber-500/15 border border-amber-400/30 p-4 text-center order-1">
              <div class="text-xs text-amber-300">מקום ראשון</div>
              <div class="font-black text-lg mt-1">${stage.podium[0]}</div>
            </div>
            <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3 text-center order-3">
              <div class="text-xs text-zinc-500">מקום שלישי</div>
              <div class="font-black mt-1">${stage.podium[2]}</div>
            </div>
          </div>
        `;
      }

      renderLeaderboard(players);

      document.querySelectorAll(".answer-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.selectedAnswer = Number(btn.dataset.answerIndex);
          playTone(state.selectedAnswer === 1 ? "success" : "fail");
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred("light");
          }
          renderStage();
        });
      });
    }

    els.nextStage.addEventListener("click", () => {
      state.stageIndex = (state.stageIndex + 1) % DEMO.stages.length;
      if (DEMO.stages[state.stageIndex].kind !== "question") {
        state.selectedAnswer = null;
      }
      renderStage();
    });

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.expand();
      tg.ready();
    }

    renderStage();
  </script>
</body>
</html>
