<!doctype html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trivia Live Demo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Heebo', 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(circle at top, rgba(251, 191, 36, 0.12), transparent 28%),
        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.16), transparent 30%),
        #09090b;
    }
    :root {
      --tg-bg: var(--tg-theme-bg-color, #09090b);
      --tg-text: var(--tg-theme-text-color, #f4f4f5);
      --tg-hint: var(--tg-theme-hint-color, #71717a);
      --tg-section: var(--tg-theme-secondary-bg-color, rgba(24, 24, 27, 0.92));
      --tg-button: var(--tg-theme-button-color, #3b82f6);
    }
    body { color: var(--tg-text); }
    .panel { background: var(--tg-section); }
    .glass { backdrop-filter: blur(10px); }
    .pulse-ring {
      box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.35);
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.35); }
      70% { box-shadow: 0 0 0 14px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
  </style>
</head>
<body class="text-zinc-100 px-3 py-3">
  <div class="max-w-md mx-auto space-y-3">
    <section class="panel glass rounded-3xl border border-white/10 p-4 shadow-2xl shadow-black/30">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <div class="text-[11px] uppercase tracking-[0.2em] text-amber-300/80 mb-1">Mini App MVP</div>
          <h1 id="title" class="text-xl font-black leading-tight"></h1>
          <p id="subline" class="text-sm text-zinc-400 mt-1"></p>
        </div>
        <div class="text-left shrink-0">
          <div class="text-[11px] text-zinc-500">מתחיל ב</div>
          <div id="starts-at" class="text-lg font-black text-blue-300"></div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 text-center">
          <div class="text-[11px] text-zinc-500">שחקנים</div>
          <div id="players-count" class="text-lg font-black mt-1"></div>
        </div>
        <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 text-center">
          <div class="text-[11px] text-zinc-500">מקום שלך</div>
          <div id="you-rank" class="text-lg font-black mt-1"></div>
        </div>
        <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 text-center">
          <div class="text-[11px] text-zinc-500">ניקוד</div>
          <div id="you-score" class="text-lg font-black mt-1"></div>
        </div>
      </div>

      <div class="rounded-[28px] bg-gradient-to-br from-zinc-950 via-zinc-900 to-zinc-950 border border-zinc-800 p-4 min-h-[350px]">
        <div id="join-panel" class="rounded-3xl border border-zinc-800 bg-zinc-950/70 p-4 mb-3 hidden">
          <div class="text-sm text-zinc-300 mb-2">כדי לבדוק מולטיפלייר, פתח/י את הדף בכמה טאבים או מכשירים והצטרפ/י בשם שונה בכל אחד.</div>
          <div class="flex items-center gap-2">
            <input id="join-name" type="text" maxlength="24" placeholder="איך יקראו לך במשחק?" class="flex-1 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-100 px-4 py-3 focus:outline-none focus:border-blue-400/40">
            <button id="join-button" type="button" class="rounded-2xl bg-blue-500 text-white px-4 py-3 font-black">הצטרפ/י</button>
          </div>
        </div>
        <div class="flex items-center justify-between mb-3">
          <div id="stage-pill" class="text-xs font-bold rounded-full px-3 py-1 bg-blue-500/15 text-blue-200 border border-blue-400/20"></div>
          <div id="countdown-wrap" class="hidden items-center gap-2">
            <div class="w-11 h-11 rounded-full bg-blue-500/15 border border-blue-400/20 flex items-center justify-center pulse-ring">
              <span id="countdown" class="font-black text-blue-200"></span>
            </div>
          </div>
        </div>

        <div id="main-surface" class="space-y-3"></div>
      </div>
    </section>

    <section class="panel glass rounded-3xl border border-white/10 p-4 shadow-xl shadow-black/25">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-sm font-bold">לוח תוצאות חי</h2>
          <p class="text-xs text-zinc-500 mt-0.5">מוביל/ה למעלה, שינויי מיקום בזמן אמת</p>
        </div>
        <div class="text-xs text-emerald-300 font-semibold">LIVE</div>
      </div>
      <div id="leaderboard" class="space-y-2"></div>
    </section>

    <section class="panel glass rounded-3xl border border-white/10 p-4 shadow-xl shadow-black/25">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-bold">בקרות בדיקה</h2>
          <p class="text-xs text-zinc-500 mt-0.5">התחל/י, אפס/י, ופתח/י עוד טאבים כדי לראות שחקנים אמיתיים על אותה טבלה.</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="start-button" type="button" class="rounded-full bg-white text-zinc-900 px-3 py-1.5 text-xs font-bold">התחל סיבוב</button>
          <button id="reset-button" type="button" class="rounded-full border border-zinc-700 text-zinc-200 px-3 py-1.5 text-xs font-bold">איפוס</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const INITIAL_STATE = {{ initial_state_json|safe }};
    const state = {
      session: INITIAL_STATE,
      playerId: localStorage.getItem("botsonTriviaLivePlayerId") || "",
      selectedAnswer: null,
      pollTimer: null,
    };

    const els = {
      joinPanel: document.getElementById("join-panel"),
      joinName: document.getElementById("join-name"),
      joinButton: document.getElementById("join-button"),
      title: document.getElementById("title"),
      subline: document.getElementById("subline"),
      startsAt: document.getElementById("starts-at"),
      playersCount: document.getElementById("players-count"),
      youRank: document.getElementById("you-rank"),
      youScore: document.getElementById("you-score"),
      stagePill: document.getElementById("stage-pill"),
      countdownWrap: document.getElementById("countdown-wrap"),
      countdown: document.getElementById("countdown"),
      mainSurface: document.getElementById("main-surface"),
      leaderboard: document.getElementById("leaderboard"),
      startButton: document.getElementById("start-button"),
      resetButton: document.getElementById("reset-button"),
    };

    function setSession(nextSession) {
      state.session = nextSession;
    }

    async function api(path, method = "GET", body = null) {
      const init = { method, headers: {} };
      if (body !== null) {
        init.headers["Content-Type"] = "application/json";
        init.body = JSON.stringify(body);
      }
      const resp = await fetch(path, init);
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.detail || data.error || `HTTP ${resp.status}`);
      }
      return data;
    }

    async function refreshState() {
      const qs = state.playerId ? `?player_id=${encodeURIComponent(state.playerId)}` : "";
      const nextSession = await api(`/api/trivia-live/state${qs}`);
      setSession(nextSession);
      renderStage();
    }

    async function joinGame() {
      const name = els.joinName.value.trim();
      if (!name) return;
      const joined = await api("/api/trivia-live/join", "POST", { name });
      state.playerId = joined.player_id;
      localStorage.setItem("botsonTriviaLivePlayerId", state.playerId);
      setSession(joined.state);
      state.selectedAnswer = null;
      renderStage();
    }

    function playTone(kind) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = kind === "success" ? "triangle" : "sawtooth";
      osc.frequency.value = kind === "success" ? 880 : 220;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.24);
      osc.onended = () => ctx.close();
    }

    function renderLeaderboard(players) {
      els.leaderboard.innerHTML = players.map((player, index) => {
        const tone = index === 0
          ? "bg-amber-500/15 border-amber-400/25 text-amber-200"
          : "bg-zinc-950/60 border-zinc-800 text-zinc-100";
        const delta = player.last_delta > 0 ? `+${player.last_delta}` : "•";
        return `
          <div class="rounded-2xl border ${tone} px-3 py-2 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-7 h-7 rounded-full ${index === 0 ? "bg-amber-400 text-zinc-950" : "bg-zinc-800 text-zinc-300"} flex items-center justify-center text-xs font-black shrink-0">${index + 1}</div>
              <div class="min-w-0">
                <div class="font-bold truncate">${player.name}</div>
                <div class="text-[11px] text-zinc-500">רצף ${player.streak} · ${delta}</div>
              </div>
            </div>
            <div class="text-left shrink-0">
              <div class="text-lg font-black">${player.score}</div>
              <div class="text-[10px] text-zinc-500">נק׳</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function answerButton(answer, index) {
      const selected = state.selectedAnswer === index;
      const session = state.session;
      let cls = "bg-zinc-900 border-zinc-800 text-zinc-100 hover:bg-zinc-800";
      if (session.status === "reveal" || session.status === "final") {
        if (session.question && index === session.question.correct) cls = "bg-emerald-500/15 border-emerald-400/30 text-emerald-200";
        else if (selected) cls = "bg-rose-500/15 border-rose-400/30 text-rose-200";
      } else if (selected) {
        cls = "bg-blue-500/15 border-blue-400/30 text-blue-200";
      }
      return `
        <button type="button" data-answer-index="${index}" class="answer-btn w-full text-right rounded-2xl border px-4 py-3 transition ${cls}">
          <div class="text-[11px] text-zinc-500 mb-1">תשובה ${index + 1}</div>
          <div class="font-semibold leading-snug">${answer.label}</div>
        </button>
      `;
    }

    function renderStage() {
      const session = state.session;
      const players = session.leaderboard || [];
      const playerCount = session.player_count || 0;
      const you = session.you || null;
      const youRank = you ? you.rank : "—";
      const youScore = you ? you.score : "—";
      const hasSelection = state.selectedAnswer !== null && session.question;
      const selectedIsCorrect = !!(hasSelection && state.selectedAnswer === session.question.correct);

      els.joinPanel.classList.toggle("hidden", !!state.playerId);
      els.title.textContent = session.title;
      els.subline.textContent = ({
        lobby: "משתתפים מצטרפים עכשיו. פתח/י את אותו קישור בכמה טאבים/מכשירים ותראה/י את כולם באותה טבלה.",
        question: "כולם רואים את אותה שאלה, אותו טיימר ואותה טבלת ניקוד בזמן אמת.",
        reveal: "אחרי שהזמן נגמר, כולם רואים את התשובה הנכונה ואת ההשפעה על הניקוד.",
        final: "הסיבוב נגמר. אפשר לאפס ולהריץ שוב, או להפוך את זה לטריוויה מתוזמנת אמיתית.",
      })[session.status] || "";
      els.startsAt.textContent = session.starts_at;
      els.playersCount.textContent = playerCount;
      els.youRank.textContent = you ? `#${youRank}` : "—";
      els.youScore.textContent = you ? `${youScore}` : "—";
      els.stagePill.textContent = ({
        lobby: "חדר המתנה",
        question: "שאלה חיה",
        reveal: "חשיפת תשובה",
        final: "סיום",
      })[session.status] || session.status;

      els.countdownWrap.classList.toggle("hidden", session.status !== "question");
      if (session.status === "question") {
        els.countdownWrap.classList.add("flex");
        els.countdown.textContent = session.remaining_s;
      } else {
        els.countdownWrap.classList.remove("flex");
      }

      if (session.status === "lobby") {
        els.mainSurface.innerHTML = `
          <div class="rounded-3xl border border-zinc-800 bg-zinc-950/60 p-4">
            <div class="text-sm text-zinc-400 mb-2">החדר נפתח</div>
            <div class="text-lg font-black mb-3">${session.host} ממתין/ה לשחקנים לפני תחילת הסיבוב</div>
            <div class="flex flex-wrap gap-2 mb-4">
              ${players.length ? players.map((player) => `<span class="rounded-full bg-zinc-900 border border-zinc-800 px-3 py-1 text-sm">${player.name}</span>`).join("") : '<span class="text-sm text-zinc-500">עדיין אין שחקנים</span>'}
            </div>
            <div class="text-xs text-zinc-500">כל טאב או מכשיר יכול להצטרף כשחקן אחר וייכנס לאותה טבלת תוצאות.</div>
          </div>
        `;
      } else if (session.status === "question") {
        els.mainSurface.innerHTML = `
          <div class="text-sm text-zinc-400">שאלה ${session.question.index} מתוך ${session.question.total} · ${session.question.category}</div>
          <div class="text-xl font-black leading-tight">${session.question.text}</div>
          <div class="grid grid-cols-1 gap-2 pt-2">
            ${session.question.options.map((label, idx) => answerButton({ label }, idx)).join("")}
          </div>
        `;
      } else if (session.status === "reveal") {
        const revealTone = hasSelection
          ? (selectedIsCorrect
              ? {
                  resultLabel: "תשובה נכונה",
                  resultValue: "+18 נק׳",
                  rankValue: "+1",
                  resultClass: "text-emerald-200",
                  answerClass: "bg-emerald-500/12 border-emerald-400/25",
                }
              : {
                  resultLabel: "תשובה שגויה",
                  resultValue: "+0 נק׳",
                  rankValue: "0",
                  resultClass: "text-rose-200",
                  answerClass: "bg-rose-500/12 border-rose-400/25",
                })
          : {
              resultLabel: "לא נבחרה תשובה",
              resultValue: "+0 נק׳",
              rankValue: "0",
              resultClass: "text-zinc-200",
              answerClass: "bg-zinc-900 border-zinc-800",
            };
        els.mainSurface.innerHTML = `
          <div class="text-sm text-zinc-400">התשובה נחשפת</div>
          <div class="text-xl font-black leading-tight">${session.question.text}</div>
          <div class="rounded-2xl ${revealTone.answerClass} p-4 mt-2 border">
            <div class="text-xs text-emerald-300 mb-1">תשובה נכונה</div>
            <div class="font-black text-lg text-emerald-100">${session.question.options[session.question.correct]}</div>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3">
              <div class="text-[11px] text-zinc-500">${revealTone.resultLabel}</div>
              <div class="text-lg font-black ${revealTone.resultClass}">${revealTone.resultValue}</div>
            </div>
            <div class="rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3">
              <div class="text-[11px] text-zinc-500">שינוי מיקום</div>
              <div class="text-lg font-black text-blue-200">${revealTone.rankValue}</div>
            </div>
          </div>
        `;
      } else if (session.status === "final") {
        const podium = players.slice(0, 3);
        els.mainSurface.innerHTML = `
          <div class="text-sm text-zinc-400">סיום הסיבוב</div>
          <div class="grid grid-cols-3 gap-2 mt-3 items-end">
            <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3 text-center order-2">
              <div class="text-xs text-zinc-500">מקום שני</div>
              <div class="font-black mt-1">${podium[1] ? podium[1].name : "—"}</div>
            </div>
            <div class="rounded-2xl bg-amber-500/15 border border-amber-400/30 p-4 text-center order-1">
              <div class="text-xs text-amber-300">מקום ראשון</div>
              <div class="font-black text-lg mt-1">${podium[0] ? podium[0].name : "—"}</div>
            </div>
            <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3 text-center order-3">
              <div class="text-xs text-zinc-500">מקום שלישי</div>
              <div class="font-black mt-1">${podium[2] ? podium[2].name : "—"}</div>
            </div>
          </div>
        `;
      }

      renderLeaderboard(players);

      document.querySelectorAll(".answer-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.selectedAnswer = Number(btn.dataset.answerIndex);
          api("/api/trivia-live/answer", "POST", { player_id: state.playerId, answer_index: state.selectedAnswer })
            .then((resp) => {
              playTone(resp.correct ? "success" : "fail");
              if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred(resp.correct ? "medium" : "light");
              }
              refreshState();
            })
            .catch(() => refreshState());
        });
      });
    }

    els.joinButton.addEventListener("click", joinGame);
    els.joinName.addEventListener("keydown", (event) => {
      if (event.key === "Enter") joinGame();
    });
    els.startButton.addEventListener("click", async () => {
      try {
        await api("/api/trivia-live/start", "POST");
        state.selectedAnswer = null;
        await refreshState();
      } catch (err) {
        alert(err.message);
      }
    });
    els.resetButton.addEventListener("click", async () => {
      await api("/api/trivia-live/reset", "POST");
      state.selectedAnswer = null;
      await refreshState();
    });

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.expand();
      tg.ready();
    }

    state.pollTimer = window.setInterval(refreshState, 1000);
    renderStage();
    refreshState();
  </script>
</body>
</html>
