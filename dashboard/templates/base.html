<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Botson Dashboard{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, body, textarea, input, button, select { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
        .nav-link { transition: all 0.2s; }
        .nav-link:hover { background-color: #27272a; color: #e4e4e7; }
        .nav-link.active { background-color: #27272a; border-right: 3px solid #6366f1; color: #f4f4f5; }
        .card { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .stat-number { font-variant-numeric: tabular-nums; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</head>
<body class="bg-zinc-950 min-h-screen text-sm text-zinc-300">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 fixed h-full p-3">
            <div class="bg-zinc-900 rounded-2xl h-[calc(100%-1.5rem)] flex flex-col border border-zinc-800 shadow-xl shadow-black/30">
                <div class="p-6 border-b border-zinc-800">
                    <h1 class="text-xl font-semibold text-zinc-100">🤖 Botson</h1>
                    <p class="text-xs text-zinc-500 mt-1">לוח בקרה</p>
                </div>
                <nav class="flex-1 p-4 space-y-1">
                    <a href="/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'home' %}active{% endif %}">
                        <span>📊</span> סקירה כללית
                    </a>
                    <a href="/settings" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'settings' %}active{% endif %}">
                        <span>⚙️</span> הגדרות
                    </a>
                    <a href="/prompts" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'prompts' %}active{% endif %}">
                        <span>💬</span> הודעות ושאלות
                    </a>
                    <a href="/levels" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'levels' %}active{% endif %}">
                        <span>📊</span> רמות
                    </a>
                    <a href="/events" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'events' %}active{% endif %}">
                        <span>🎉</span> אירועים
                    </a>
                    <a href="/trivia" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'trivia' %}active{% endif %}">
                        <span>🧠</span> טריוויה
                    </a>
                    <a href="/spam" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'spam' %}active{% endif %}">
                        <span>🛡️</span> ספאם
                    </a>
                    <a href="/members" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'members' %}active{% endif %}">
                        <span>👥</span> חברים
                    </a>
                    <a href="/activity" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 {% if active_page == 'activity' %}active{% endif %}">
                        <span>📋</span> לוג פעילות
                    </a>
                </nav>
                <div class="p-4 border-t border-zinc-800">
                    <a href="/logout" class="flex items-center gap-3 px-4 py-2 rounded-lg text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800 transition-all duration-200">
                        <span>🚪</span> התנתק
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main content -->
        <main class="flex-1 mr-64 p-8">
            <div class="max-w-5xl">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        // Generic API call helper
        async function apiCall(url, data = null) {
            const opts = {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
            };
            if (data) opts.body = JSON.stringify(data);
            const res = await fetch(url, opts);
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return res.json();
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-500/90' : 'bg-rose-500/90';
            toast.className = `fixed top-4 left-4 px-5 py-3 rounded-lg shadow-lg text-white text-sm z-50 backdrop-blur-sm ${bg}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showConfirm(message, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center';
            overlay.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-6 max-w-sm mx-4 shadow-2xl">
                    <p class="text-sm text-zinc-200 mb-5">${message}</p>
                    <div class="flex gap-3 justify-end">
                        <button class="cancel px-4 py-2 text-sm text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded-lg cursor-pointer">ביטול</button>
                        <button class="confirm px-4 py-2 text-sm text-rose-300 hover:bg-rose-500/10 rounded-lg cursor-pointer">אישור</button>
                    </div>
                </div>`;
            overlay.querySelector('.cancel').onclick = () => overlay.remove();
            overlay.querySelector('.confirm').onclick = () => { onConfirm(); overlay.remove(); };
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            document.body.appendChild(overlay);
        }

        async function generateContent(field, mode, textareaIdOrCategory, category) {
            // Resolve textarea: by id, or by data-category attribute
            let textarea = document.getElementById(textareaIdOrCategory);
            if (!textarea) {
                textarea = document.querySelector(`textarea[data-category="${textareaIdOrCategory}"]`);
            }
            if (!textarea) return;

            const existing = textarea.value;
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ מייצר...';

            try {
                const res = await apiCall('/api/generate', {
                    field,
                    mode,
                    existing: mode === 'append' ? existing : '',
                    category: category || '',
                });

                if (mode === 'append' && existing.trim()) {
                    textarea.value = existing.trimEnd() + '\n' + res.content;
                } else {
                    textarea.value = res.content;
                }
                showToast('תוכן נוצר בהצלחה');
            } catch (e) {
                showToast('שגיאה ביצירת תוכן: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
