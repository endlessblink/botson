<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botson — התחברות</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🤖</div>
            <h1 class="text-2xl font-bold text-gray-800">Botson</h1>
            <p class="text-gray-500 mt-1">לוח בקרה</p>
        </div>
        {% if error %}
        <div class="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-center text-sm">
            {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/login">
            <input
                type="password"
                name="password"
                placeholder="סיסמה"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-center"
                autofocus
                required
            >
            <button
                type="submit"
                class="w-full mt-4 bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition"
            >
                כניסה
            </button>
        </form>
    </div>
</body>
</html>
